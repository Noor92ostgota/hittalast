      const card = document.getElementById('assignment-card');
      card.innerHTML = `

        <form id="assignForm">
          <div class="row">
            <div class="field"><label>Bil</label>
              <select name="vehicleId" required>
                <option value="">— välj —</option>
                ${vehicles.map(v => `<option value="${v.id}" ${b.vehicleId===v.id?'selected':''}>${esc(v.regNr)} ${esc(v.model || '')}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Chaufför</label>
              <select name="driverId" required>
                <option value="">— välj —</option>
                ${activeDrivers.map(d => `<option value="${d.id}" ${b.driverId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="btn-row">
            <button type="submit">Spara tilldelning</button>
            <button type="button" id="assignCancel" class="secondary">Avbryt</button>
          </div>
        </form>`;
      document.getElementById('assignCancel').onclick = () => navigate('/booking/' + b.id);
      document.getElementById('assignForm').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const fresh = await db.get('bookings', b.id);
        fresh.vehicleId = f.get('vehicleId') || null;
        fresh.driverId = f.get('driverId') || null;
        fresh.assignedAt = new Date().toISOString();
        await db.put('bookings', fresh);
        toast('Tilldelning sparad');
        navigate('/booking/' + b.id);
      };
    };
  }

  // Bind actions
  if (document.getElementById('acceptBtn')) {
    document.getElementById('acceptBtn').onclick = async () => {
      const btn = document.getElementById('acceptBtn');
      btn.disabled = true; btn.textContent = '⏳ Accepterar...';
      try {
        if (!me || !me.id) { toast('Du måste vara inloggad', 'err'); return navigate('/login'); }
        // Använd SECURITY DEFINER-funktion (kringgår RLS på UPDATE)
        const { data, error } = await sb.rpc('accept_booking', { p_booking_id: b.id });
        if (error) throw error;
        // Sätt commission via en separat UPDATE (nu är vi hauler så RLS tillåter)
        if (b.price) {
          await sb.from('bookings').update({ commission: commissionFor(b.price) }).eq('id', b.id);
        }
        await notify(b.buyerId, { type:'accepted', bookingId: b.id, message: `${me.name} har accepterat din körning ${b.fromLocation} → ${b.toLocation}.` });
        toast('✅ Uppdrag accepterat. Kontaktuppgifter visas nu.');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Accept-fel:', err);
        toast('Kunde inte acceptera: ' + (err.message || err), 'err');
        btn.disabled = false;
        btn.textContent = `✓ Acceptera ${b.price ? fmtMoney(b.price) : ''}`;
      }
    };
  }

  // Bud-actions (åkare som lägger bud)
  const placeBidBtn = document.getElementById('placeBidBtn');
  if (placeBidBtn) {
    placeBidBtn.onclick = async () => {
      try {
        if (!me || !me.id) { toast('Du måste vara inloggad', 'err'); return navigate('/login'); }
        const amountEl = document.getElementById('bidAmount');
        const amount = Number(amountEl && amountEl.value);
        if (!amount || amount <= 0) { toast('Ange ett giltigt belopp', 'err'); return; }
        const fresh = await db.get('bookings', b.id);
        if (!fresh) { toast('Bokningen finns inte', 'err'); return navigate('/'); }
        if (fresh.status !== 'open') { toast('Körningen är inte längre öppen', 'err'); return navigate('/'); }
        await db.add('bids', {
          bookingId: b.id, haulerId: me.id,
          rounds: [{ by:'hauler', amount, at: Date.now() }],
          status: 'pending',
          createdAt: Date.now(),
        });
        await notify(b.buyerId, { type:'new_bid', bookingId: b.id, message: `Nytt bud (${fmtMoney(amount)}) från ${me.name} på ${b.fromLocation} → ${b.toLocation}.` });
        toast('Bud skickat — uppdragsgivaren har aviserats');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Bud-fel:', err);
        toast('Kunde inte lägga bud: ' + (err.message || err), 'err');
      }
    };
  }
  const acceptCounterBtn = document.getElementById('acceptCounterBtn');
  if (acceptCounterBtn) {
    acceptCounterBtn.onclick = async () => {
      try {
        if (!me || !me.id) { toast('Du måste vara inloggad', 'err'); return navigate('/login'); }
        const bid = await db.get('bids', acceptCounterBtn.dataset.bid);
        if (!bid) { toast('Budet hittas inte', 'err'); return; }
        const amount = latestBidAmount(bid);
        const fresh = await db.get('bookings', b.id);
        if (!fresh || fresh.status !== 'open') { toast('Körningen är inte längre öppen', 'err'); return navigate('/'); }
        fresh.status = 'accepted'; fresh.haulerId = me.id;
        fresh.price = amount;
        fresh.acceptedAt = Date.now();
        fresh.commission = commissionFor(amount);
        fresh.contactVisible = true;
        await db.put('bookings', fresh);
        bid.status = 'accepted';
        await db.put('bids', bid);
        const others = await bidsForBooking(b.id);
        for (const o of others) {
          if (o.id !== bid.id && o.status === 'pending') {
            o.status = 'rejected';
            await db.put('bids', o);
            await notify(o.haulerId, { type:'bid_rejected', bookingId: b.id, message: `Ditt bud på ${b.fromLocation} → ${b.toLocation} avslogs (uppdraget gick till annan åkare).` });
          }
        }
        await notify(b.buyerId, { type:'accepted', bookingId: b.id, message: `${me.name} accepterade ditt motbud ${fmtMoney(amount)} på ${b.fromLocation} → ${b.toLocation}.` });
        toast('Motbud accepterat. Kontaktuppgifter visas nu.');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Accept-counter-fel:', err);
        toast('Kunde inte acceptera motbud: ' + (err.message || err), 'err');
      }
    };
  }
  const counterBackBtn = document.getElementById('counterBackBtn');
  if (counterBackBtn) {
    counterBackBtn.onclick = async () => {
      try {
        const amount = Number((document.getElementById('newCounter') || {}).value);
        if (!amount || amount <= 0) { toast('Ange ett giltigt belopp', 'err'); return; }
        const bid = await db.get('bids', counterBackBtn.dataset.bid);
        if (!bid) { toast('Budet hittas inte', 'err'); return; }
        bid.rounds.push({ by:'hauler', amount, at: Date.now() });
        await db.put('bids', bid);
        await notify(b.buyerId, { type:'counter', bookingId: b.id, message: `${me.name} svarade med motbud ${fmtMoney(amount)} på ${b.fromLocation} → ${b.toLocation}.` });
        toast('Motbud skickat');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Motbud-fel:', err);
        toast('Kunde inte skicka motbud: ' + (err.message || err), 'err');
      }
    };
  }
  const withdrawBidBtn = document.getElementById('withdrawBidBtn');
  if (withdrawBidBtn) {
    withdrawBidBtn.onclick = async () => {
      if (!confirm('Dra tillbaka ditt bud?')) return;
      const bid = await db.get('bids', withdrawBidBtn.dataset.bid);
      bid.status = 'withdrawn';
      await db.put('bids', bid);
      await notify(b.buyerId, { type:'bid_withdrawn', bookingId: b.id, message: `${me.name} drog tillbaka sitt bud på ${b.fromLocation} → ${b.toLocation}.` });
      toast('Bud tillbakadraget');
      navigate('/booking/' + b.id);
    };
  }

  // Buyer-actions: acceptera bud / motbud / avslå
  document.querySelectorAll('button[data-acceptbid]').forEach(btn => {
    btn.onclick = async () => {
      const bid = await db.get('bids', btn.dataset.acceptbid);
      const amount = latestBidAmount(bid);
      const fresh = await db.get('bookings', b.id);
      if (fresh.status !== 'open') { toast('Körningen är inte längre öppen', 'err'); return navigate('/'); }
      fresh.status = 'accepted';
      fresh.haulerId = bid.haulerId;
      fresh.price = amount;
      fresh.acceptedAt = Date.now();
      fresh.commission = commissionFor(amount);
      fresh.contactVisible = true;
      await db.put('bookings', fresh);
      bid.status = 'accepted';
      await db.put('bids', bid);
      const all = await bidsForBooking(b.id);
      for (const o of all) {
        if (o.id !== bid.id && o.status === 'pending') {
          o.status = 'rejected';
          await db.put('bids', o);
          await notify(o.haulerId, { type:'bid_rejected', bookingId: b.id, message: `Ditt bud på ${b.fromLocation} → ${b.toLocation} avslogs (uppdraget gick till annan åkare).` });
        }
      }
      await notify(bid.haulerId, { type:'bid_accepted', bookingId: b.id, message: `Ditt bud ${fmtMoney(amount)} på ${b.fromLocation} → ${b.toLocation} accepterades. Kontaktuppgifter är nu synliga.` });
      toast('Bud accepterat — körningen tilldelad');
      navigate('/booking/' + b.id);
    };
  });
  document.querySelectorAll('button[data-counterbid]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.counterbid;
      const inp = document.querySelector(`input[data-counter-input="${id}"]`);
      const amount = Number(inp && inp.value);
      if (!amount || amount <= 0) { toast('Ange ett giltigt motbud', 'err'); return; }
      const bid = await db.get('bids', id);
      bid.rounds.push({ by:'buyer', amount, at: Date.now() });
      await db.put('bids', bid);
      await notify(bid.haulerId, { type:'counter', bookingId: b.id, message: `Uppdragsgivaren skickade motbud ${fmtMoney(amount)} på ${b.fromLocation} → ${b.toLocation}.` });
      toast('Motbud skickat');
      navigate('/booking/' + b.id);
    };
  });
  document.querySelectorAll('button[data-rejectbid]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Avslå budet?')) return;
      const bid = await db.get('bids', btn.dataset.rejectbid);
      bid.status = 'rejected';
      await db.put('bids', bid);
      await notify(bid.haulerId, { type:'bid_rejected', bookingId: b.id, message: `Ditt bud på ${b.fromLocation} → ${b.toLocation} avslogs.` });
      toast('Bud avslaget');
      navigate('/booking/' + b.id);
    };
  });
  // LASTAD-knapp — targeted UPDATE (rör bara loaded_at)
  if (document.getElementById('markLoadedBtn')) {
    document.getElementById('markLoadedBtn').onclick = async () => {
      const btn = document.getElementById('markLoadedBtn');
      btn.disabled = true; btn.textContent = '⏳ Sparar...';
      try {
        const { error } = await sb.from('bookings').update({ loaded_at: new Date().toISOString() }).eq('id', b.id);
        if (error) throw error;
        const route = `${b.fromLocation} → ${b.toLocation}`;
        if (b.buyerId) await notify(b.buyerId, { type:'loaded', bookingId: b.id, message: `📍 LASTAT: ${me.name} har lastat på ${route}.` });
        if (b.haulerId && b.haulerId !== me.id) await notify(b.haulerId, { type:'loaded', bookingId: b.id, message: `📍 LASTAT: ${me.name} har lastat på ${route}.` });
        toast('📍 Markerat som lastat — båda parter aviserade');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Lastad-fel:', err);
        toast('Kunde inte markera: ' + (err.message || err), 'err');
        btn.disabled = false; btn.textContent = '📍 Markera som LASTAD';
      }
    };
  }

  // LOSSAD-knapp — targeted UPDATE (rör bara unloaded_at)
  if (document.getElementById('markUnloadedBtn')) {
    document.getElementById('markUnloadedBtn').onclick = async () => {
      const btn = document.getElementById('markUnloadedBtn');
      btn.disabled = true; btn.textContent = '⏳ Sparar...';
      try {
        const { error } = await sb.from('bookings').update({ unloaded_at: new Date().toISOString() }).eq('id', b.id);
        if (error) throw error;
        const route = `${b.fromLocation} → ${b.toLocation}`;
        if (b.buyerId) await notify(b.buyerId, { type:'unloaded', bookingId: b.id, message: `🏁 LOSSAT: ${me.name} har levererat på ${route}.` });
        if (b.haulerId && b.haulerId !== me.id) await notify(b.haulerId, { type:'unloaded', bookingId: b.id, message: `🏁 LOSSAT: ${me.name} har levererat på ${route}.` });
        toast('🏁 Markerat som lossat — båda parter aviserade');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Lossad-fel:', err);
        toast('Kunde inte markera: ' + (err.message || err), 'err');
        btn.disabled = false; btn.textContent = '🏁 Markera som LOSSAD';
      }
    };
  }

  if (document.getElementById('completeBtn')) {
    document.getElementById('completeBtn').onclick = async () => {
      const btn = document.getElementById('completeBtn');
      btn.disabled = true; btn.textContent = '⏳ Sparar...';
      try {
        const proofFile = document.getElementById('proofFile').files[0];
        if (!proofFile) { toast('Ladda upp bild på fraktsedel först', 'err'); btn.disabled = false; btn.textContent = '✓ Slutför uppdrag'; return; }
        const proofUrl = await uploadImage(proofFile, 'proof-images');
        // Bygg payload med BARA fälten vi vill uppdatera (undvik FK-bugg från gamla värden)
        const updates = {
          status: 'completed',
          completed_at: new Date().toISOString(),
          proof_image_url: proofUrl,
          // Bara om vi har en giltig driver-rad — annars NULL (FK accepterar NULL)
          completed_by_driver_id: (isDriver && ctx.driverRow) ? ctx.driverRow.id : null,
        };
        const { error } = await sb.from('bookings').update(updates).eq('id', b.id);
        if (error) throw error;
        await notify(b.buyerId, { type:'completed', bookingId: b.id, message: `${me.name} har utfört körningen ${b.fromLocation} → ${b.toLocation}.` });
        toast('Uppdrag markerat som utfört');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Complete-fel:', err);
        toast('Kunde inte markera som utförd: ' + (err.message || err), 'err');
        btn.disabled = false; btn.textContent = '✓ Slutför uppdrag';
      }
    };
  }

  // ÅNGRA LASTNING — targeted UPDATE
  if (document.getElementById('undoLoadedBtn')) {
    document.getElementById('undoLoadedBtn').onclick = async () => {
      if (!confirm('Ångra lastning? Tidsstämpeln tas bort och båda parter aviseras om ändringen.')) return;
      const btn = document.getElementById('undoLoadedBtn');
      btn.disabled = true; btn.textContent = '⏳ Ångrar...';
      try {
        const { error } = await sb.from('bookings').update({ loaded_at: null }).eq('id', b.id);
        if (error) throw error;
        const route = `${b.fromLocation} → ${b.toLocation}`;
        if (b.buyerId) await notify(b.buyerId, { type:'undo_load', bookingId: b.id, message: `↩ ${me.name} har ÅNGRAT lastning på ${route}.` });
        if (b.haulerId && b.haulerId !== me.id) await notify(b.haulerId, { type:'undo_load', bookingId: b.id, message: `↩ ${me.name} har ÅNGRAT lastning på ${route}.` });
        toast('↩ Lastning ångrad');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Ångra-fel:', err);
        toast('Kunde inte ångra: ' + (err.message || err), 'err');
        btn.disabled = false; btn.textContent = '↩ Ångra lastning';
      }
    };
  }

  // ÅNGRA LOSSNING — targeted UPDATE
  if (document.getElementById('undoUnloadedBtn')) {
    document.getElementById('undoUnloadedBtn').onclick = async () => {
      if (!confirm('Ångra lossning? Tidsstämpeln tas bort och båda parter aviseras om ändringen.')) return;
      const btn = document.getElementById('undoUnloadedBtn');
      btn.disabled = true; btn.textContent = '⏳ Ångrar...';
      try {
        const { error } = await sb.from('bookings').update({ unloaded_at: null }).eq('id', b.id);
        if (error) throw error;
        const route = `${b.fromLocation} → ${b.toLocation}`;
        if (b.buyerId) await notify(b.buyerId, { type:'undo_unload', bookingId: b.id, message: `↩ ${me.name} har ÅNGRAT lossning på ${route}.` });
        if (b.haulerId && b.haulerId !== me.id) await notify(b.haulerId, { type:'undo_unload', bookingId: b.id, message: `↩ ${me.name} har ÅNGRAT lossning på ${route}.` });
        toast('↩ Lossning ångrad');
        navigate('/booking/' + b.id);
      } catch (err) {
        console.error('Ångra-fel:', err);
        toast('Kunde inte ångra: ' + (err.message || err), 'err');
        btn.disabled = false; btn.textContent = '↩ Ångra lossning';
      }
    };
  }
  if (document.getElementById('toggleContactBtn')) {
    document.getElementById('toggleContactBtn').onclick = async () => {
      const fresh = await db.get('bookings', b.id);
      fresh.contactVisible = !fresh.contactVisible;
      await db.put('bookings', fresh);
      navigate('/booking/' + fresh.id);
    };
  }
  if (document.getElementById('cancelBtn')) {
    document.getElementById('cancelBtn').onclick = async () => {
      // Förhandskoll: räkna bud + meddelanden + notifikationer som ska raderas
      const relBids = await db.byIndex('bids', 'bookingId', b.id).catch(() => []);
      const relMsgs = await db.byIndex('messages', 'bookingId', b.id).catch(() => []);
      const relNotifs = await db.byIndex('notifications', 'bookingId', b.id).catch(() => []);
      const warnings = [];
      if (relBids.length) warnings.push(`${relBids.length} bud`);
      if (relMsgs.length) warnings.push(`${relMsgs.length} meddelanden`);
      if (relNotifs.length) warnings.push(`${relNotifs.length} notifikationer`);
      const warnText = warnings.length ? `\n\n⚠️ Detta raderar även ${warnings.join(', ')}.` : '';
      if (!confirm(`Ta bort körningen permanent?${warnText}\n\nDetta kan inte ångras.`)) return;
      try {
        for (const bid of relBids) await db.del('bids', bid.id);
        for (const m of relMsgs) await db.del('messages', m.id);
        for (const n of relNotifs) await db.del('notifications', n.id);
        await db.del('bookings', b.id);
        toast('Körning borttagen');
        navigate('/');
      } catch (err) {
        console.error('Radera-fel:', err);
        toast('Kunde inte radera: ' + (err.message || err), 'err');
      }
    };
  }

  if (!isDriver && !ctx.isPublic) await renderChat(b, buyer, hauler, me, ctx);

  // PDF-fakturaunderlag-knapp
  if (document.getElementById('invoicePdfBtn')) {
    document.getElementById('invoicePdfBtn').onclick = async () => {
      const btn = document.getElementById('invoicePdfBtn');
      btn.disabled = true; btn.textContent = '⏳ Skapar PDF...';
      try {
        const doc = await generateInvoicePDF(b, buyer, hauler);
        doc.save(safeFileName(`fakturaunderlag-${b.fromLocation}-${b.toLocation}-${b.id.slice(0,8)}`) + '.pdf');
      } catch (err) {
        console.error('PDF-fel:', err);
        toast('Kunde inte skapa PDF: ' + (err.message || err), 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = '📄 Hämta fakturaunderlag (PDF)';
      }
    };
  }
}

// --------- Chatt ---------
// Trådmodell: (bookingId, haulerId) — en tråd per åkare som skriver med köparen.
// När bokningen är accepterad finns bara den accepterade åkarens tråd.
async function renderChat(b, buyer, hauler, me, ctx) {
  const area = document.getElementById('chat-area');
  const { isBuyer, isAssignedHauler, isOtherHauler, isAdmin } = ctx;

  if (b.status === 'open' && isBuyer) {
    // Köparen: visa trådlista (en per åkare som skrivit)
    const all = await db.byIndex('messages', 'bookingId', b.id);
    const byHauler = {};
    all.forEach(m => {
      const hid = m.haulerId;
      (byHauler[hid] = byHauler[hid] || []).push(m);
    });
    const haulerIds = Object.keys(byHauler).map(Number);
    if (haulerIds.length === 0) {
      area.innerHTML = `<div class="muted">Inga åkare har kontaktat dig om denna körning ännu.</div>`;
      return;
    }
    const haulers = await Promise.all(haulerIds.map(id => db.get('users', id)));
    const dealClosed = b.status !== 'open';
    area.innerHTML = `
      <div class="chat-thread-list" id="thread-list">
        ${haulers.map((h, i) => `<div class="thread-item" data-hid="${h.id}">
          <b>${dealClosed ? esc(h.name) : 'Åkare ' + String.fromCharCode(66 + i)}</b>${dealClosed && h.company ? ' · ' + esc(h.company) : ''}
          <div class="muted" style="font-size:11px;margin-top:2px">${byHauler[h.id].length} meddelanden</div>
        </div>`).join('')}
      </div>
      <div id="thread-body"></div>
    `;
    const pickHauler = async hid => {
      document.querySelectorAll('.thread-item').forEach(el => el.classList.toggle('active', el.dataset.hid === hid));
      await renderChatThread(b, buyer, await db.get('users', hid), me, ctx);
    };
    document.querySelectorAll('.thread-item').forEach(el => el.onclick = () => pickHauler(el.dataset.hid));
    await pickHauler(haulerIds[0]);
    return;
  }

  // Annars: rak tråd
  let threadHauler = hauler;
  if (isOtherHauler) threadHauler = me; // åkare som skriver om en öppen bokning → deras egen tråd
  if (!threadHauler) {
    area.innerHTML = `<div class="muted">Ingen chatt ännu.</div>`;
    return;
  }
  await renderChatThread(b, buyer, threadHauler, me, ctx);
}

async function renderChatThread(b, buyer, threadHauler, me, ctx) {
  const { isBuyer, isAdmin } = ctx;
  const body = document.getElementById('thread-body') || document.getElementById('chat-area');
  const msgs = (await db.byIndex('messages', 'bookingId', b.id)).filter(m => m.haulerId === threadHauler.id);
  msgs.sort((a, b) => new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime());

  const users = {};
  users[buyer.id] = buyer;
  users[threadHauler.id] = threadHauler;

  const dealClosed = b.status !== 'open';
  // Skriva: man måste vara part i konversationen (köpare eller tråd-åkare).
  // Admin som är part får också skriva — bara "ren admin" (inte involverad) blockeras.
  const isInvolved = me.id === buyer.id || me.id === threadHauler.id;
  const canWrite = b.status !== 'completed' && isInvolved;
  const adminOnlyViewer = isAdmin && !isInvolved;

  // Pseudonym före accept: A för uppdragsgivare, B för motparten
  const aliasFor = (uid) => {
    if (dealClosed) return users[uid]?.name || '?';
    if (uid === buyer.id) return 'Uppdragsgivare A';
    if (uid === threadHauler.id) return 'Åkare B';
    return 'Användare';
  };

  body.innerHTML = `
    ${!dealClosed ? `<div class="banner warn" style="margin-bottom:10px">⚠ Anonym chatt: namn, företag, telefon, e-post och webbadresser döljs automatiskt tills uppdraget är accepterat.</div>` : ''}
    <div class="chat" id="chat-box">
      ${msgs.length === 0 ? `<div class="muted" style="text-align:center;padding:20px">Inga meddelanden ännu</div>` : ''}
      ${msgs.map(m => {
        const isMe = m.senderId === me.id;
        const who = aliasFor(m.senderId);
        let txt = m.content;
        if (!dealClosed && m.senderId !== me.id) {
          const knownNames = [buyer.name, buyer.company, threadHauler.name, threadHauler.company].filter(Boolean);
          txt = detectContact(txt, knownNames).masked;
        }
        return `<div class="msg ${isMe ? 'me' : 'them'}">
          <div class="who">${esc(who)}</div>
          <div>${esc(txt)}</div>
          <div class="ts">${fmtDate(m.createdAt)}</div>
        </div>`;
      }).join('')}
    </div>
    ${canWrite ? `
      <div class="chat-input">
        <textarea id="chat-txt" placeholder="Skriv ett meddelande..."></textarea>
        <button id="chat-send">Skicka</button>
      </div>
      <div id="chat-warn" class="banner err" style="display:none;margin-top:6px"></div>`
      : adminOnlyViewer ? `<div class="muted" style="margin-top:8px;font-size:12px">Du ser chatten som admin men kan inte skriva (du är inte part i konversationen).</div>`
      : b.status === 'completed' ? `<div class="muted" style="margin-top:8px;font-size:12px">Chatten är låst — uppdraget är utfört.</div>`
      : ''}
  `;

  const box = document.getElementById('chat-box');
  box.scrollTop = box.scrollHeight;

  const send = async () => {
    const raw = document.getElementById('chat-txt').value.trim();
    if (!raw) return;
    if (!dealClosed) {
      const knownNames = [buyer.name, buyer.company, threadHauler.name, threadHauler.company].filter(Boolean);
      const det = detectContact(raw, knownNames);
      if (det.hits.length > 0) {
        const w = document.getElementById('chat-warn');
        w.style.display = '';
        w.innerHTML = `🚫 Det är inte tillåtet att dela kontaktuppgifter (${det.hits.join(', ')}) i chatten innan uppdraget är accepterat. Meddelandet skickades inte.`;
        return;
      }
    }
    await db.add('messages', {
      bookingId: b.id,
      haulerId: threadHauler.id,
      senderId: me.id,
      content: raw,
      createdAt: Date.now(),
    });
    // Notifiera motparten
    const recipient = me.id === buyer.id ? threadHauler.id : buyer.id;
    await notify(recipient, { type:'new_message', bookingId: b.id, message: `Nytt meddelande från ${aliasFor(me.id)} i chatt om ${b.fromLocation} → ${b.toLocation}.` });
    document.getElementById('chat-txt').value = '';
    renderChatThread(b, buyer, threadHauler, me, ctx);
  };
  if (document.getElementById('chat-send')) {
    document.getElementById('chat-send').onclick = send;
    document.getElementById('chat-txt').onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    };
  }
}

// --------- PWA: service worker AVAKTIVERAD pga cache-problem under utveckling ---------
// Avregistrera eventuell befintlig service worker så användare alltid får senaste koden
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => reg.unregister().catch(() => {}));
  }).catch(() => {});
  // Rensa caches också
  if (window.caches) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k).catch(() => {}))).catch(() => {});
  }
}

// --------- PWA: "Installera app"-prompt ---------
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  // Visa en diskret toast efter 3 sek när användaren är på landningssidan
  setTimeout(() => {
    if (location.hash === '#/' || location.hash === '') {
      const existing = document.getElementById('install-toast');
      if (existing) return;
      const t = document.createElement('div');
      t.id = 'install-toast';
      t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1d22;padding:14px 18px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:2000;display:flex;align-items:center;gap:12px;max-width:92%;font-size:14px';
      t.innerHTML = '<span>📱 Installera hittalast som app?</span><button id="install-yes" style="background:#f97316;color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600">Installera</button><button id="install-no" style="background:transparent;border:0;cursor:pointer;color:#6b7280;font-size:20px;padding:0 4px">×</button>';
      document.body.appendChild(t);
      document.getElementById('install-yes').onclick = async () => {
        t.remove();
        if (_deferredInstallPrompt) {
          _deferredInstallPrompt.prompt();
          await _deferredInstallPrompt.userChoice;
          _deferredInstallPrompt = null;
        }
      };
      document.getElementById('install-no').onclick = () => { t.remove(); _deferredInstallPrompt = null; };
    }
  }, 3000);
});

// --------- Start ---------
// Robust init: render() körs ALLTID, även om refreshSession() hänger/failar.
// Detta löser multi-tab-låsning som blockerar sb.auth.getSession().
(async () => {
  // Försök hämta session — men låt INTE detta blockera UI:t.
  // Om det hänger >2s, render:a ändå (refreshSession har egen timeout).
  refreshSession()
    .then(() => render())
    .catch(e => { console.error('Init refreshSession-fel:', e); render(); });

  // Lyssna på auth-ändringar (login/logout i annan flik etc.)
  try {
    sb.auth.onAuthStateChange((event, session) => {
      refreshSession().finally(() => render());
    });
  } catch (e) {
    console.error('onAuthStateChange-fel:', e);
  }

  // Säkerhetsnät: om render inte körts efter 3s pga någon obekant orsak, tvinga den.
  setTimeout(() => {
    const appEl = document.getElementById('app');
    if (appEl && appEl.innerHTML.length === 0) {
      console.warn('App-DIV tom efter 3s — tvingar render()');
      try { render(); } catch (e) { console.error('Säkerhetsnät-render-fel:', e); }
    }
  }, 3000);
})();
</script>
