<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hittalast.se — Hitta last, returlaster & uppdrag</title>
<meta name="description" content="Digital marknadsplats för åkerier och speditörer. Matcha transportuppdrag, hitta returlaster och förhandla pris direkt.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hittalast">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="hittalast.se — Sveriges marknadsplats för åkerier">
<meta property="og:description" content="Minska tomkörningar, öka lönsamheten och maximera kapaciteten i varje fordon.">
<meta property="og:image" content="https://hittalast.se/logo.png">
<meta property="og:url" content="https://hittalast.se">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg:#f7f7f8; --card:#fff; --ink:#1a1d22; --muted:#6b7280; --line:#e5e7eb;
    --brand:#f97316; --brand-dark:#ea580c; --brand-ink:#fff;
    --hero-1:#0a0a0a; --hero-2:#1f1f1f; --hero-3:#2d2d2d;
    --ok:#147a3d; --warn:#b45309; --danger:#b42318;
    --open:#ea580c; --accepted:#147a3d; --completed:#4b5563;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header.topbar{background:#fff;color:var(--ink);padding:8px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
  header.topbar h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px;display:flex;align-items:center}
  header.topbar .brand-link{display:flex;align-items:center;text-decoration:none}
  header.topbar .brand-logo{height:72px;width:auto;display:block;max-width:280px;object-fit:contain}
  @media (max-width:900px){header.topbar{padding:8px 14px}header.topbar .brand-logo{height:60px;max-width:220px}}
  @media (max-width:600px){header.topbar{padding:6px 10px}header.topbar .brand-logo{height:48px;max-width:170px}}
  header.topbar nav{display:flex;gap:6px;margin-left:auto;align-items:center}
  header.topbar nav a{color:#374151;text-decoration:none;padding:8px 12px;border-radius:6px;font-weight:500;font-size:13px}
  header.topbar nav a:hover{background:#fff7ed;color:var(--brand-dark)}
  header.topbar .who{color:#6b7280;font-size:12px;margin-right:8px}
  header.topbar #logout-link{color:#b42318}
  header.topbar #logout-link:hover{background:#fee2e2}
  main{max-width:1100px;margin:24px auto;padding:0 20px}
  h2{margin:0 0 16px;font-size:20px}
  h3{margin:0 0 12px;font-size:15px;color:#374151}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .fv-form h4{margin:10px 0 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .fv-form h4:first-child{margin-top:0}
  .fv-form .field{margin-bottom:8px}
  .fv-form textarea{min-height:50px}
  .fv-form .btn-row{margin-top:10px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  textarea{min-height:70px;resize:vertical}
  .field{margin-bottom:12px}
  .check{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .check input{width:auto}
  button,.btn{background:var(--brand);color:var(--brand-ink);border:0;padding:9px 14px;border-radius:6px;cursor:pointer;font:inherit;font-weight:500}
  button:hover,.btn:hover{filter:brightness(1.08)}
  button.secondary,.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.ok{background:var(--ok)} button.warn{background:var(--warn)} button.danger{background:var(--danger)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  table.compact{font-size:13px;table-layout:auto}
  table.compact th,table.compact td{padding:6px 6px;line-height:1.3}
  table.compact .badge{font-size:10px;padding:1px 6px;margin:1px 2px 1px 0}
  table.compact .icon-btn{padding:4px 8px;font-size:12px;line-height:1}
  table.compact .nowrap{white-space:nowrap}
  tr:hover td{background:#fafbfc;cursor:pointer}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .badge.open{background:#fff7ed;color:var(--open)}
  .badge.accepted{background:#d6f2e0;color:var(--accepted)}
  .badge.completed{background:#e5e7eb;color:var(--completed)}
  .badge.feature{background:#fff3e0;color:#b45309;margin-right:3px;font-size:10px;padding:1px 6px;text-transform:none;letter-spacing:0;font-weight:600}
  .muted{color:var(--muted)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tabs button{background:none;color:var(--muted);border-radius:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:500}
  .tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
  .empty{text-align:center;padding:40px;color:var(--muted)}
  .auth-wrap{max-width:400px;margin:80px auto}
  .auth-wrap .card{padding:28px}
  .auth-wrap h2{text-align:center;margin-bottom:20px}
  .auth-wrap .switch{text-align:center;margin-top:12px;font-size:13px}
  .auth-wrap a{color:var(--brand);cursor:pointer;text-decoration:none}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:6px 16px;font-size:13px;margin:4px 0}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  .chat{border:1px solid var(--line);border-radius:8px;background:#fafbfc;height:340px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:72%;padding:8px 12px;border-radius:10px;font-size:13px;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:var(--brand);color:#fff}
  .msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line)}
  .msg .who{font-size:11px;opacity:.75;margin-bottom:2px;font-weight:600}
  .msg .ts{font-size:10px;opacity:.65;margin-top:2px}
  .chat-input{display:flex;gap:8px;margin-top:10px}
  .chat-input textarea{flex:1;min-height:42px;max-height:120px}
  .chat-thread-list .thread-item{padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;cursor:pointer;background:#fff}
  .chat-thread-list .thread-item.active{border-color:var(--brand);background:#fff7ed}
  .thumb{max-width:100%;max-height:240px;border-radius:6px;border:1px solid var(--line);display:block;margin-top:6px}
  .toast{position:fixed;bottom:20px;right:20px;background:#1a1d22;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:1000;animation:slide .2s ease-out}
  .toast.err{background:var(--danger)}
  @keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .banner{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:13px}
  .banner.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  .banner.info{background:#fff7ed;color:#9a3412;border:1px solid #fdba74}
  .banner.ok{background:#d6f2e0;color:var(--accepted);border:1px solid #86efac}
  .banner.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
  .stat .val{font-size:22px;font-weight:600}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}

  /* ============== Bud-fält & counter-input (skalbara) ============== */
  .bid-field{max-width:260px;width:100%}
  @media (max-width:600px){.bid-field{max-width:none}}
  .counter-inp{width:110px;margin-left:6px;display:inline-block}
  @media (max-width:600px){.counter-inp{width:100%;margin-left:0;margin-top:6px;display:block}}

  /* Admin pricing-table inputs */
  .pricing-min,.pricing-max{width:90px;max-width:100%}
  .pricing-price{width:120px;max-width:100%}

  /* ============== Spinner-animation (laddnings-feedback) ============== */
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============== Bell-länk ============== */
  .bell-link{position:relative;margin:0 6px;display:inline-flex;align-items:center}
  .bell-link .label{display:none}
  .bell-badge{position:absolute;top:-6px;right:-10px;background:#e11;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px}
  @media (max-width:600px){
    .bell-link{margin:0;display:flex}
    .bell-link .label{display:inline}
    .bell-badge{position:static;margin-left:auto}
  }

  /* ============== HAMBURGARMENY (mobil) ============== */
  .hamburger{display:none;background:transparent;border:0;width:40px;height:40px;padding:8px;cursor:pointer;margin-left:auto;flex-direction:column;justify-content:space-between;align-items:stretch}
  .hamburger span{display:block;height:3px;background:#0f2847;border-radius:2px;transition:transform .2s,opacity .2s}
  .hamburger[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
  .hamburger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .hamburger[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
  .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:998}
  .nav-backdrop.open{display:block}

  /* ============== LANDING PAGE (lansering 1 juli) ============== */
  .landing{min-height:100vh;background:linear-gradient(135deg,#0a0a0a 0%,#1f1f1f 60%,#2d2d2d 100%);color:#fff;position:relative;overflow:hidden}
  .landing::before{content:"";position:absolute;top:-10%;left:-10%;width:60%;height:60%;background:radial-gradient(circle,rgba(249,115,22,.18) 0%,transparent 70%);pointer-events:none}
  .landing::after{content:"";position:absolute;bottom:-30%;right:-10%;width:70%;height:70%;background:radial-gradient(circle,rgba(249,115,22,.12) 0%,transparent 70%);pointer-events:none}
  .landing-inner{max-width:1100px;margin:0 auto;padding:60px 24px 40px;position:relative;z-index:1}
  .landing-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px}
  .landing-logo{display:inline-flex;align-items:center;cursor:pointer;text-decoration:none;background:#fff;padding:20px 32px;border-radius:20px;box-shadow:0 12px 36px rgba(0,0,0,.28)}
  .landing-logo-img{height:120px;width:auto;display:block;max-width:100%}
  @media (max-width:900px){
    .landing-logo{padding:16px 24px;border-radius:16px}
    .landing-logo-img{height:96px}
  }
  @media (max-width:600px){
    .landing-logo{padding:12px 18px;border-radius:14px}
    .landing-logo-img{height:72px}
  }
  @media (max-width:380px){
    .landing-logo{padding:10px 14px}
    .landing-logo-img{height:58px}
  }
  .landing-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
  .landing-eyebrow{display:inline-block;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.4px;margin-bottom:18px;backdrop-filter:blur(6px)}
  .landing-h1{font-size:clamp(32px,5vw,52px);line-height:1.08;margin:0 0 18px;font-weight:700;letter-spacing:-.8px}
  .landing-h1 .accent{color:#f97316}
  .landing-sub{font-size:clamp(15px,1.4vw,18px);line-height:1.55;color:rgba(255,255,255,.86);margin-bottom:28px;max-width:560px}
  .landing-bullets{list-style:none;padding:0;margin:0 0 32px;display:flex;flex-wrap:wrap;gap:10px 20px}
  .landing-bullets li{display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.92)}
  .landing-bullets li::before{content:"✓";color:#f97316;font-weight:bold}
  .landing-card{background:rgba(255,255,255,.97);color:var(--ink);padding:30px;border-radius:16px;box-shadow:0 25px 60px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.15);position:relative}
  .landing-card h2{font-size:20px;margin:0 0 6px;color:var(--ink)}
  .landing-card .lead{font-size:13px;color:var(--muted);margin-bottom:18px}
  .landing-card label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;display:block}
  .landing-card input,.landing-card select{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;background:#fff;margin-bottom:12px}
  .landing-card input:focus,.landing-card select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
  .landing-card .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#f97316 0%,#ea580c 100%);color:#fff;border:0;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;letter-spacing:.2px;transition:transform .1s,box-shadow .2s;box-shadow:0 4px 14px rgba(249,115,22,.4)}
  .landing-card .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(249,115,22,.5)}
  .landing-card .btn-primary:disabled{opacity:.7;cursor:not-allowed}
  .landing-card .fineprint{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
  .landing-success{background:#d6f2e0;color:#147a3d;padding:24px;border-radius:12px;text-align:center}
  .landing-success h3{margin:0 0 8px;font-size:18px;color:#147a3d}
  .landing-success p{margin:0;font-size:14px}
  .countdown{display:flex;gap:14px;margin:30px 0}
  .countdown-box{flex:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:14px 6px;text-align:center;backdrop-filter:blur(6px)}
  .countdown-val{font-size:clamp(22px,3.5vw,34px);font-weight:700;line-height:1;color:#fff}
  .countdown-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.7);margin-top:4px}
  .landing-features{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:80px;padding-top:48px;border-top:1px solid rgba(255,255,255,.12)}
  .feature{background:rgba(255,255,255,.06);padding:22px;border-radius:14px;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px)}
  .feature h3{font-size:15px;margin:0 0 8px;color:#fff;font-weight:600}
  .feature p{font-size:13px;color:rgba(255,255,255,.78);line-height:1.5;margin:0}
  .feature-icon{font-size:24px;margin-bottom:8px;display:block}
  .landing-footer{text-align:center;padding:40px 0 20px;color:rgba(255,255,255,.55);font-size:12px}
  @media (max-width:800px){
    .landing-inner{padding:30px 16px}
    .landing-hero{grid-template-columns:1fr;gap:30px}
    .landing-nav{margin-bottom:30px}
    .landing-features{grid-template-columns:1fr 1fr;gap:14px;margin-top:50px;padding-top:30px}
    .countdown{gap:8px}
    .countdown-box{padding:10px 4px}
  }

  /* ============== RESPONSIVE: tablet (≤900px) ============== */
  @media (max-width:900px){
    main{padding:0 14px;margin:16px auto}
    .row,.row-3,.row-4{grid-template-columns:1fr 1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    header.topbar{padding:10px 14px;gap:10px;flex-wrap:wrap}
    header.topbar nav a span.label{display:none}
    .kv{grid-template-columns:130px 1fr}
  }

  /* ============== RESPONSIVE: mobile (≤600px) ============== */
  @media (max-width:600px){
    body{font-size:14px}
    main{padding:0 10px;margin:10px auto}
    h2{font-size:18px;margin-bottom:12px}
    h3{font-size:14px}
    .card{padding:14px;margin-bottom:12px;border-radius:8px}

    /* Stacka alla formulärrader */
    .row,.row-3,.row-4{grid-template-columns:1fr;gap:8px}

    /* Stats: 2 i bredd */
    .stats{grid-template-columns:repeat(2,1fr);gap:8px}
    .stat{padding:10px}
    .stat .val{font-size:18px}
    .stat .lbl{font-size:10px}

    /* Topbar: hamburgermeny tar över */
    header.topbar{padding:10px 14px;gap:8px;justify-content:space-between;flex-wrap:nowrap;overflow:visible}
    header.topbar h1{font-size:14px;white-space:nowrap;flex-shrink:0}
    .hamburger{display:flex}
    header.topbar nav{position:fixed;top:0;right:0;bottom:0;width:80%;max-width:320px;background:#fff;flex-direction:column;align-items:stretch;padding:60px 18px 24px;gap:4px;margin:0;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease-out;z-index:999;box-shadow:-8px 0 24px rgba(0,0,0,.18);border-left:1px solid var(--line)}
    header.topbar nav.open{transform:translateX(0)}
    header.topbar nav a{padding:14px 16px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:15px;color:#1a1d22;white-space:normal;font-weight:500}
    header.topbar nav a:hover{background:#f3f4f6}
    header.topbar nav a span.label{display:inline}
    header.topbar nav .who{padding:10px 16px;color:#6b7280;font-size:13px;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
    header.topbar nav #logout-link{margin-top:6px;background:#fee2e2;color:#b42318}
    header.topbar nav #logout-link:hover{background:#fecaca}

    /* Tabeller: gör scrollbara horisontellt */
    .card>table,
    .card>div>table,
    .card table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
    .card>table thead,
    .card table thead{display:table-header-group}
    .card>table tbody,
    .card table tbody{display:table-row-group}
    .card>table tr,
    .card table tr{display:table-row}
    .card>table th,
    .card>table td,
    .card table th,
    .card table td{display:table-cell;padding:8px 6px;font-size:12px;white-space:nowrap;max-width:none}
    table.compact th,table.compact td{padding:6px 4px;font-size:11px}

    /* Knappar: större touch-yta */
    button,.btn{padding:10px 14px;font-size:14px;min-height:40px}
    .btn-row{gap:6px}
    .btn-row .btn,.btn-row button{flex:1 1 auto;min-width:0}
    table .icon-btn,button.icon-btn,.btn.icon-btn{min-height:auto;padding:6px 10px;font-size:13px}

    /* Auth-vy */
    .auth-wrap{margin:20px 10px;max-width:none}
    .auth-wrap .card{padding:18px}

    /* Key-value lists */
    .kv{grid-template-columns:1fr;gap:2px 0;margin:8px 0}
    .kv dt{color:var(--muted);font-size:11px;margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
    .kv dd{margin:0 0 4px;font-size:14px}

    /* Chatt */
    .chat{height:280px;padding:10px}
    .msg{max-width:88%;font-size:13px}

    /* Banner */
    .banner{padding:8px 12px;font-size:12px}

    /* Toast */
    .toast{left:10px;right:10px;bottom:10px;padding:10px 14px;font-size:13px}

    /* Inputs */
    input,select,textarea{padding:10px 12px;font-size:16px} /* 16px hindrar zoom på iOS */
    textarea{min-height:60px}

    /* Badges mindre */
    .badge{font-size:10px;padding:1px 6px}

    /* Empty state mindre padding */
    .empty{padding:24px 16px}

    /* Booking-rader: bredare touch-yta */
    tr[data-id]>td:first-child{padding-left:8px}
  }

  /* ============== RESPONSIVE: small mobile (≤380px) ============== */
  @media (max-width:380px){
    .stats{grid-template-columns:1fr}
    header.topbar h1{font-size:13px}
    h2{font-size:16px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>

<script>

// camelCase ↔ snake_case helpers
function camelToSnake(str) { return str.replace(/([A-Z])/g, '_$1').toLowerCase(); }
function snakeToCamel(str) { return str.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }
function objToSnake(obj) {
  if (!obj || typeof obj !== 'object' || obj instanceof Date || obj instanceof Blob) return obj;
  if (Array.isArray(obj)) return obj;
  const out = {};
  for (const k in obj) {
    if (obj[k] === undefined) continue;
    if (k === 'passwordHash') continue;
    out[camelToSnake(k)] = obj[k];
  }
  return out;
}
function objToCamel(obj) {
  if (!obj || typeof obj !== 'object' || obj instanceof Date) return obj;
  if (Array.isArray(obj)) return obj.map(objToCamel);
  const out = {};
  for (const k in obj) out[snakeToCamel(k)] = obj[k];
  return out;
}

// DB-wrapper med Supabase. Bevarar gamla API:t (db.add/get/byIndex/put/del/all).
const db = {
  async all(table) {
    const t = TABLE_MAP[table] || table;
    const { data, error } = await sb.from(t).select('*');
    if (error) { console.error('db.all', t, error); throw error; }
    return (data || []).map(objToCamel);
  },
  async get(table, id) {
    const t = TABLE_MAP[table] || table;
    if (!id) return null;
    const { data, error } = await sb.from(t).select('*').eq('id', id).maybeSingle();
    if (error) { console.error('db.get', t, id, error); throw error; }
    return data ? objToCamel(data) : null;
  },
  async byIndex(table, key, value) {
    const t = TABLE_MAP[table] || table;
    const col = camelToSnake(key);
    if (value === undefined || value === null) return [];
    const { data, error } = await sb.from(t).select('*').eq(col, value);
    if (error) { console.error('db.byIndex', t, col, error); throw error; }
    return (data || []).map(objToCamel);
  },
  async oneByIndex(table, key, value) {
    const t = TABLE_MAP[table] || table;
    const col = camelToSnake(key);
    if (value === undefined || value === null) return null;
    const { data, error } = await sb.from(t).select('*').eq(col, value).maybeSingle();
    if (error) { console.error('db.oneByIndex', t, col, error); throw error; }
    return data ? objToCamel(data) : null;
  },
  async add(table, obj) {
    const t = TABLE_MAP[table] || table;
    const snakeObj = objToSnake(obj);
    delete snakeObj.id;
    // Bilder läggs i Storage separat; här tar vi bort blob-fält som inte finns i databasen
    if (snakeObj.booking_image instanceof Blob) delete snakeObj.booking_image;
    if (snakeObj.proof_image instanceof Blob) delete snakeObj.proof_image;
    // Mappa timestamp-nummer → ISO-strängar
    for (const k of ['created_at','accepted_at','completed_at','assigned_at','updated_at','subscription_activated_at']) {
      if (typeof snakeObj[k] === 'number') snakeObj[k] = new Date(snakeObj[k]).toISOString();
    }
    // 'read' boolean (var 0/1 i gamla koden)
    if (typeof snakeObj.read === 'number') snakeObj.read = !!snakeObj.read;
    const { data, error } = await sb.from(t).insert(snakeObj).select().single();
    if (error) { console.error('db.add', t, error, snakeObj); throw error; }
    return objToCamel(data);
  },
  async put(table, obj) {
    const t = TABLE_MAP[table] || table;
    const snakeObj = objToSnake(obj);
    const id = snakeObj.id;
    if (snakeObj.booking_image instanceof Blob) delete snakeObj.booking_image;
    if (snakeObj.proof_image instanceof Blob) delete snakeObj.proof_image;
    for (const k of ['created_at','accepted_at','completed_at','assigned_at','updated_at','subscription_activated_at']) {
      if (typeof snakeObj[k] === 'number') snakeObj[k] = new Date(snakeObj[k]).toISOString();
    }
    if (typeof snakeObj.read === 'number') snakeObj.read = !!snakeObj.read;
    const { data, error } = await sb.from(t).update(snakeObj).eq('id', id).select().single();
    if (error) { console.error('db.put', t, id, error, snakeObj); throw error; }
    return objToCamel(data);
  },
  async del(table, id) {
    const t = TABLE_MAP[table] || table;
    const { error } = await sb.from(t).delete().eq('id', id);
    if (error) { console.error('db.del', t, id, error); throw error; }
  },
};

// --------- Bilduppladdning till Supabase Storage ---------
async function uploadImage(file, bucket = 'booking-images') {
  if (!file || !file.name || !file.size) return null;
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = `${(crypto.randomUUID && crypto.randomUUID()) || Date.now() + '-' + Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { contentType: file.type || 'image/png' });
  if (error) { console.error('uploadImage', error); throw error; }
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

// Hjälp: konvertera Blob till data-URL
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Hjälp: läs bildens dimensions för att bevara aspect ratio i PDF
function loadImageDimensions(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

// Hämta bild som data-URL för PDF-inbäddning
// Hanterar både public buckets (booking-images) och privata (proof-images) via Supabase storage-klient
async function imageUrlToDataUrl(url) {
  if (!url) return null;
  try {
    // Extrahera bucket + path från Supabase-URL för att kunna använda storage-klienten (skickar med auth)
    // Format: .../storage/v1/object/(public|sign|authenticated)/BUCKET/PATH
    const m = url.match(/\/storage\/v1\/object\/(?:public|sign|authenticated)\/([^/?]+)\/([^?]+)/);
    if (m) {
      const bucket = m[1];
      const path = decodeURIComponent(m[2]);
      const { data, error } = await sb.storage.from(bucket).download(path);
      if (!error && data) return await blobToDataUrl(data);
      console.warn('storage.download misslyckades, fallback till fetch():', error?.message);
    }
    // Fallback: vanlig fetch (för public-bucket URL eller externa bilder)
    const resp = await fetch(url);
    if (!resp.ok) { console.warn('fetch bild misslyckades:', resp.status, url); return null; }
    const blob = await resp.blob();
    return await blobToDataUrl(blob);
  } catch (err) {
    console.error('imageUrlToDataUrl fel:', err);
    return null;
  }
}

// Skapa fakturaunderlag-PDF från en bokning
async function generateInvoicePDF(b, buyer, hauler) {

  // Ladda logotypen för headern
  let logoDataUrl = null;
  try {
    const logoUrl = (window.location.origin || 'https://hittalast.se') + '/logo.png';
    const resp = await fetch(logoUrl);
    if (resp.ok) {
      const blob = await resp.blob();
      logoDataUrl = await blobToDataUrl(blob);
    }
  } catch (e) { console.warn('Kunde inte ladda logo:', e); }

  // HEADER med logga + titel
  let headerHeight = 22;
  if (logoDataUrl) {
    try {
      const dims = await loadImageDimensions(logoDataUrl);
      const logoH = 32; // Större logga (var 18)
      const logoW = dims && dims.h > 0 ? logoH * (dims.w / dims.h) : 48;
      const fmt = logoDataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
      doc.addImage(logoDataUrl, fmt, M, y, logoW, logoH);
      headerHeight = Math.max(headerHeight, logoH + 4);
    } catch (e) { console.warn('Logo addImage fel:', e); }
  } else {
    // Fallback: textbaserad logga
    doc.setFontSize(24);
    doc.setTextColor(249, 115, 22);
    doc.text('hittalast.se', M, y + 12);
  }

  // Höger sida: titel
  doc.setFontSize(16);
  doc.setTextColor(0);
  doc.text('FAKTURAUNDERLAG', W - M, y + 8, { align: 'right' });
  doc.setFontSize(9);
  doc.setTextColor(100);
  doc.text('Körnings-ID: ' + b.id.slice(0, 8), W - M, y + 14, { align: 'right' });
  if (b.completedAt) doc.text('Utförd: ' + new Date(b.completedAt).toLocaleDateString('sv-SE'), W - M, y + 19, { align: 'right' });
  y += headerHeight;

  // "Förmedlat via" — tydligt så kunderna inte tror hittalast.se fakturerar
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text('Förmedlat via hittalast.se · Fakturering sker direkt mellan parterna nedan', M, y);
  y += 6;

  doc.setDrawColor(220);
  doc.line(M, y, W - M, y);
  y += 8;

  // Parter (2 kolumner)
  const colW = (W - M * 2) / 2 - 4;
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text('UPPDRAGSGIVARE', M, y);
  doc.text('UTFÖRARE', M + colW + 8, y);
  y += 6;
  doc.setFontSize(11);
  doc.setTextColor(0);
  function ptyBlock(p, x, yStart) {
    let yy = yStart;
    if (!p) { doc.text('—', x, yy); return yy + 5; }
    doc.setFont(undefined, 'bold');
    doc.text(p.company || p.name || '—', x, yy);
    doc.setFont(undefined, 'normal');
    yy += 5;
    doc.setFontSize(10);
    if (p.name && p.company) { doc.text(p.name, x, yy); yy += 4; }
    if (p.org_nr || p.orgNr) { doc.text('Org.nr ' + (p.org_nr || p.orgNr), x, yy); yy += 4; }
    if (p.address) { doc.text(p.address, x, yy); yy += 4; }
    if (p.email) { doc.text(p.email, x, yy); yy += 4; }
    if (p.phone) { doc.text(p.phone, x, yy); yy += 4; }
    doc.setFontSize(11);
    return yy;
  }
  const yLeft = ptyBlock(buyer, M, y);
  const yRight = ptyBlock(hauler, M + colW + 8, y);
  y = Math.max(yLeft, yRight) + 4;

  doc.setDrawColor(220);
  doc.line(M, y, W - M, y);
  y += 8;

  // Uppdrag-block
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text('UPPDRAG', M, y);
  y += 6;
  doc.setFontSize(11);
  doc.setTextColor(0);
  function row(label, value) {
    doc.setFont(undefined, 'normal');
    doc.text(label, M, y);
    doc.setFont(undefined, 'bold');
    doc.text(String(value || '—'), M + 50, y);
    doc.setFont(undefined, 'normal');
    y += 5.5;
  }
  row('Från:', b.fromLocation + (b.fromPostal ? ' (' + b.fromPostal + ')' : ''));
  row('Till:', b.toLocation + (b.toPostal ? ' (' + b.toPostal + ')' : ''));
  if (b.loadDate) row('Lastas:', b.loadDate + (b.loadTime ? ' ' + b.loadTime : ''));
  if (b.unloadDate) row('Lossas:', b.unloadDate + (b.unloadTime ? ' ' + b.unloadTime : ''));
  if (b.loadedAt) row('Lastades:', new Date(b.loadedAt).toLocaleString('sv-SE'));
  if (b.unloadedAt) row('Lossades:', new Date(b.unloadedAt).toLocaleString('sv-SE'));
  if (b.weight) row('Vikt:', b.weight.toLocaleString('sv-SE') + ' kg');
  if (b.flm) row('Flakmeter:', b.flm);
  if (b.pallets) row('Antal pall:', b.pallets);
  if (b.adr) row('ADR:', 'Ja');
  if (b.tailLift) row('Bakgavellift:', 'Ja');
  if (b.openSide) row('Öppningsbar sida:', 'Ja');
  y += 3;

  // Pris
  doc.setDrawColor(220);
  doc.line(M, y, W - M, y);
  y += 8;
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text('PRIS (exkl. moms)', M, y);
  y += 7;
  doc.setFontSize(20);
  doc.setTextColor(249, 115, 22);
  doc.text((b.price ? b.price.toLocaleString('sv-SE') + ' kr' : '—'), M, y);
  y += 10;

  // Beskrivning
  if (b.description) {
    doc.setFontSize(10);
    doc.setTextColor(120);
    doc.text('BESKRIVNING', M, y);
    y += 5;
    doc.setFontSize(10);
    doc.setTextColor(0);
    const lines = doc.splitTextToSize(b.description, W - M * 2);
    doc.text(lines, M, y);
    y += lines.length * 4.5 + 4;
  }

  // Bilder — större format med bevarad aspect ratio
  async function addImage(label, url) {
    if (!url) { console.log('Ingen bild-URL för:', label); return; }
    const dataUrl = await imageUrlToDataUrl(url);
    if (!dataUrl) {
      console.warn('Kunde inte ladda bild:', label, url);
      if (y > 250) { doc.addPage(); y = M; }
      doc.setFontSize(10);
      doc.setTextColor(180, 50, 50);
      doc.text(`⚠ ${label}: Bilden kunde inte laddas`, M, y);
      y += 8;
      return;
    }
    // Räkna ut aspect ratio
    const dims = await loadImageDimensions(dataUrl);
    const maxW = W - M * 2;   // bredd inom marginaler
    const maxH = 140;          // max höjd per bild
    let imgW = maxW, imgH = maxW * 0.7;
    if (dims && dims.w > 0 && dims.h > 0) {
      const ratio = dims.h / dims.w;
      imgW = maxW;
      imgH = imgW * ratio;
      if (imgH > maxH) { imgH = maxH; imgW = imgH / ratio; }
    }
    // Ny sida om inte plats kvar
    if (y + imgH + 10 > 280) { doc.addPage(); y = M; }
    doc.setFontSize(10);
    doc.setTextColor(120);
    doc.text(label, M, y);
    y += 5;
    try {
      // Detektera format från data-URL
      const fmt = dataUrl.startsWith('data:image/png') ? 'PNG'
        : dataUrl.startsWith('data:image/webp') ? 'WEBP'
        : 'JPEG';
      doc.addImage(dataUrl, fmt, M, y, imgW, imgH);
      // Tunn ram runt bilden för tydlighet
      doc.setDrawColor(200);
      doc.rect(M, y, imgW, imgH);
      y += imgH + 10;
    } catch (e) {
      console.error('addImage fel:', e);
      doc.setFontSize(10);
      doc.setTextColor(180, 50, 50);
      doc.text(`⚠ Kunde inte rita bilden i PDF (${e.message || 'okänt fel'})`, M, y);
      y += 8;
    }
  }
  await addImage('BILD PÅ BOKNING', b.bookingImageUrl || b.bookingImage);
  await addImage('FRAKTSEDEL', b.proofImageUrl || b.proofImage);

  // Footer på alla sidor — tydligt att hittalast.se BARA är en plattform
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(120);
    // Disclaimer på rad 1
    doc.text('Detta är ett fakturaunderlag som förmedlats via hittalast.se. Fakturering sker direkt mellan uppdragsgivare och utförare.', W / 2, 283, { align: 'center' });
    // Plattformens info på rad 2
    doc.setTextColor(160);
    doc.text('hittalast.se är en förmedlande plattform — inte avtalspart. · Hitta Last Sverige AB · Genererat ' + new Date().toLocaleDateString('sv-SE'), W / 2, 288, { align: 'center' });
    doc.text(`Sida ${i} / ${pageCount}`, W - M, 293, { align: 'right' });
  }
  return doc;
}

// Filnamn för PDF/fil
function safeFileName(s) {
  return (s || 'fakturaunderlag').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, '-').slice(0, 60);
}

// Skapa ZIP med flera PDF:er
async function generateInvoicesZip(bookings, buyer) {
  if (!window.JSZip) throw new Error('JSZip-biblioteket är inte laddat ännu.');
  const zip = new JSZip();
  for (const b of bookings) {
    let hauler = b.haulerId ? await db.get('users', b.haulerId) : null;
    if (!hauler) hauler = { name: '(saknas)' };
    const doc = await generateInvoicePDF(b, buyer, hauler);
    const blob = doc.output('blob');
    const fname = safeFileName(`${b.completedAt ? b.completedAt.slice(0,10) : 'okand'}_${b.fromLocation}_${b.toLocation}_${b.id.slice(0,8)}`) + '.pdf';
    zip.file(fname, blob);
  }
  return await zip.generateAsync({ type: 'blob' });
}

// --------- Auth (Supabase) ---------
let _sessionUser = null;
function currentUser() { return _sessionUser; }
function setCurrentUser(u) { _sessionUser = u; }

async function refreshSession() {
  try {
    // Supabase JS v2 använder LockManager för auth-storage som kan HÄNGA
    // när flera flikar är öppna samtidigt (en flik håller låset, andra väntar).
    // Vi timeout:ar getSession() efter 2s så app:en inte hänger för evigt.
    const sessionPromise = sb.auth.getSession();
    const timeoutPromise = new Promise(resolve =>
      setTimeout(() => resolve({ data: { session: null }, __timedOut: true }), 2000)
    );
    const result = await Promise.race([sessionPromise, timeoutPromise]);
    if (result.__timedOut) {
      console.warn('refreshSession: getSession() timeout (multi-tab lock) — fortsätter utan session');
    }
    const session = result?.data?.session;
    if (session && session.user) {
      // db.get kan också hänga om RLS-läsningen blockas — timeout även här
      const profilePromise = db.get('users', session.user.id);
      const profileTimeout = new Promise(resolve => setTimeout(() => resolve(null), 2000));
      const profile = await Promise.race([profilePromise, profileTimeout]);
      _sessionUser = profile
        ? { ...profile, email: session.user.email }
        : { id: session.user.id, email: session.user.email, role: 'akare', name: '' };
    } else {
      _sessionUser = null;
    }
  } catch (e) { console.error('refreshSession', e); _sessionUser = null; }
}

async function login(email, pwd) {
  email = (email || '').trim().toLowerCase();
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) throw new Error('Fel e-post eller lösenord');
  await refreshSession();
  return _sessionUser;
}

async function register(data) {
  const email = (data.email || '').toLowerCase().trim();
  const { data: result, error } = await sb.auth.signUp({
    email,
    password: data.pwd,
    options: { data: { name: data.name || '', role: data.role || 'akare' } }
  });
  if (error) {
    if (/already|registered/i.test(error.message)) throw new Error('E-post finns redan registrerad');
    throw error;
  }
  // Vänta så triggern hinner skapa profilen, uppdatera sedan
  await new Promise(r => setTimeout(r, 700));
  if (result.user) {
    await sb.from('profiles').update({
      role: data.role || 'akare',
      name: (data.name || '').trim(),
      phone: (data.phone || '').trim(),
      company: (data.company || '').trim(),
      org_nr: (data.orgNr || '').trim(),
      address: (data.address || '').trim(),
      contact_person: (data.contactPerson || '').trim(),
      invoice_recipient: (data.invoiceRecipient || '').trim(),
      invoice_address: (data.invoiceAddress || '').trim(),
      invoice_email: (data.invoiceEmail || '').trim(),
      invoice_gln: (data.invoiceGln || '').trim(),
      invoice_reference: (data.invoiceReference || '').trim(),
      offices: data.offices || [],
    }).eq('id', result.user.id);
  }
  await refreshSession();
  return _sessionUser;
}

async function supabaseLogout() {
  await sb.auth.signOut();
  _sessionUser = null;
}

    unloadDate: '', unloadTime: '',
    weight: null, flm: null, pallets: null, price: null,
    adr: false, tailLift: false, openSide: false,
    description: '',
  };

  const normDate = (s) => {
    if (!s) return '';
    s = s.trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return s;
    m = s.match(/^(\d{1,2})[/.\-](\d{1,2})(?:[/.\-](\d{2,4}))?$/);
    if (m) {
      const d = m[1].padStart(2, '0');
      const mo = m[2].padStart(2, '0');
      let y = m[3] || String(new Date().getFullYear());
      if (y.length === 2) y = '20' + y;
      return `${y}-${mo}-${d}`;
    }
    return '';
  };

  // Tid → HH:MM. Stöder "0700", "07:00", "07.00", "0700-1545" (tar första delen).
  const normTime = (s) => {
    if (!s) return '';
    s = s.trim();
    let m = s.match(/^(\d{1,2})[:\.](\d{2})/);
    if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
    m = s.match(/^(\d{2})(\d{2})\b/); // militärtid 0700
    if (m) return `${m[1]}:${m[2]}`;
    return '';
  };

  // Plocka stad + postnr ur ett textblock. Hanterar "SE-597 91 ÅTVIDABERG" och "11122 STOCKHOLM".
  const extractPostalAndCity = (block) => {
    if (!block) return { postal: '', city: '' };
    // SE-prefix eller bara siffror, följt av stad
    const m1 = block.match(/(?:SE[\s\-]*)?(\d{3}\s?\d{2})\s+([A-ZÅÄÖa-zåäö][A-ZÅÄÖa-zåäö\s\-]{1,30})/);
    if (m1) {
      const city = m1[2].split(/\n/)[0].trim().replace(/[,;].*$/, '').trim();
      return { postal: m1[1].replace(/\s/g, ''), city };
    }
    // Bara postnr
    const m2 = block.match(/(?:SE[\s\-]*)?(\d{3}\s?\d{2})/);
    if (m2) return { postal: m2[1].replace(/\s/g, ''), city: '' };
    return { postal: '', city: '' };
  };

  // Block-baserad extraktion: hämta texten mellan "COLLECT FROM:" / "DELIVER TO:" / "Pickup:" osv.
  const blockBetween = (startRe, endResAlt) => {
    const start = text.search(startRe);
    if (start < 0) return '';
    const after = text.slice(start);
    const startMatch = after.match(startRe);
    const startEnd = start + (startMatch ? startMatch[0].length : 0);
    let earliest = text.length;
    for (const re of endResAlt) {
      const idx = text.slice(startEnd).search(re);
      if (idx >= 0 && (startEnd + idx) < earliest) earliest = startEnd + idx;
    }
    return text.slice(startEnd, earliest).trim();
  };

  // FROM-block (COLLECT FROM / Lastas / Hämtas / Pickup-from / Avsändare / Från)
  const fromStarters = /(?:COLLECT\s*FROM|LASTAS|H[ÄA]MTAS|PICKUP\s*FROM|AVS[ÄA]NDARE|FR[ÅA]N|LASTORT)\s*[:\-]/i;
  const toStarters   = /(?:DELIVER\s*TO|LOSSAS|LEVERERAS|DELIVERY|MOTTAGARE|TILL|LOSSORT|DESTINATION)\s*[:\-]/i;
  const breakers     = [
    toStarters, /(?:^|\n)\s*Pickup\s*:/i, /(?:^|\n)\s*Fix\s*:/i,
    /(?:^|\n)\s*WGT\s*:/i, /(?:^|\n)\s*LDM\s*:/i, /(?:^|\n)\s*Time\s*:/i,
    /(?:^|\n)\s*OrderID/i, /(?:^|\n)\s*Load-Remarks/i, /(?:^|\n)\s*HAZ\s*:/i,
    /(?:^|\n)\s*Cll\s*:/i, /(?:^|\n)\s*Consref/i, /(?:^|\n)\s*Ext\.Ref/i,
    /(?:^|\n)\s*UnLoad-Remarks/i,
  ];
  const fromBlock = blockBetween(fromStarters, breakers);
  const toBlock   = blockBetween(toStarters, breakers.filter(b => b !== toStarters));

  if (fromBlock) {
    const { postal, city } = extractPostalAndCity(fromBlock);
    result.fromPostal = postal;
    result.fromLocation = city;
  }
  if (toBlock) {
    const { postal, city } = extractPostalAndCity(toBlock);
    result.toPostal = postal;
    result.toLocation = city;
  }

  // Fallback: "X → Y" / "X till Y" på en rad
  if (!result.fromLocation || !result.toLocation) {
    const r = text.match(/([A-ZÅÄÖ][A-Za-zÅÄÖåäö\s\-]{1,30}?)\s*(?:->|=>|→|–|—|-|\bto\b|\btill\b)\s*([A-ZÅÄÖ][A-Za-zÅÄÖåäö\s\-]{1,30})/);
    if (r) {
      if (!result.fromLocation) result.fromLocation = r[1].trim();
      if (!result.toLocation) result.toLocation = r[2].trim();
    }
  }

  // Sista utväg på postnr: alla 5-siffriga grupper i ordning
  if (!result.fromPostal || !result.toPostal) {
    const all = [...text.matchAll(/(?:SE[\s\-]*)?\b(\d{3}\s?\d{2})\b/g)].map(m => m[1].replace(/\s/g, ''));
    if (!result.fromPostal && all[0]) result.fromPostal = all[0];
    if (!result.toPostal && all[1]) result.toPostal = all[1];
  }

  // LASTNINGSDAG (Pickup, lastning, lastas, hämtas)
  let dm = text.match(/(?:Pickup|lastning|lastdatum|lastas|h[äa]mtas|upphämtning)\s*[:\-]?\s*(\d{4}-\d{2}-\d{2}|\d{1,2}[/.\-]\d{1,2}(?:[/.\-]\d{2,4})?)/i);
  if (dm) result.loadDate = normDate(dm[1]);

  // LASTNINGSTID — fältet "Time:" i pickup-sektionen, eller normal tid
  // I DHL-format: "Time:0700-1545" → 07:00
  let tm = text.match(/Pickup[^\n]*?\n[^\n]*?Time\s*:\s*(\d{1,2}[:\.]\d{2}|\d{4})/i)
        || text.match(/(?:lastning|lastas|h[äa]mtas|pickup)[^\n]*?(\d{1,2}[:\.]\d{2}|\b\d{4}\b)(?:\s*[-–]\s*\d{4})?/i);
  if (tm) result.loadTime = normTime(tm[1]);

  // LOSSNINGSDAG — Fix: i DHL, eller lossning/levereras
  dm = text.match(/(?:DELIVER\s*TO[\s\S]*?Fix\s*:|Fix\s*:|lossning|lossdatum|lossas|levereras|delivery|leverans)\s*[:\-]?\s*(\d{4}-\d{2}-\d{2}|\d{1,2}[/.\-]\d{1,2}(?:[/.\-]\d{2,4})?)/i);
  if (dm) result.unloadDate = normDate(dm[1]);
  tm = text.match(/(?:DELIVER\s*TO[\s\S]*?Time\s*:|Fix[^\n]*?Time\s*:|lossning|lossas|levereras)[\s:]*?(\d{1,2}[:\.]\d{2}|\b\d{4}\b)/i);
  if (tm && tm[1] !== '-') result.unloadTime = normTime(tm[1]);

  // Fallback: alla datum i ordning
  if (!result.loadDate || !result.unloadDate) {
    const dates = [...text.matchAll(/(\d{4}-\d{2}-\d{2}|\d{1,2}[/.\-]\d{1,2}(?:[/.\-]\d{2,4})?)/g)]
      .map(m => normDate(m[1])).filter(Boolean);
    if (!result.loadDate && dates[0]) result.loadDate = dates[0];
    if (!result.unloadDate && dates[1]) result.unloadDate = dates[1];
  }

  // VIKT (WGT eller "vikt: X kg" eller "X kg")
  let m = text.match(/\bWGT\s*[:\-]?\s*([\d.,]+)/i)
       || text.match(/(?:vikt|weight)\s*[:\-]?\s*([\d.,]+)\s*(?:kg|kilo)?/i)
       || text.match(/([\d.,]+)\s*(?:kg|kilo)\b/i);
  if (m) {
    const v = parseFloat(m[1].replace(/\s/g, '').replace(',', '.'));
    if (!isNaN(v) && v > 0) result.weight = v;
  }

  // FLM / LDM (flakmeter / loading meter)
  m = text.match(/\b(?:flm|ldm|flakmeter|loading\s*meter)\s*[:\-]?\s*([\d.,]+)/i)
   || text.match(/([\d.,]+)\s*\b(?:flm|ldm|flakmeter|lm)\b/i);
  if (m) {
    const v = parseFloat(m[1].replace(/\s/g, '').replace(',', '.'));
    if (!isNaN(v) && v > 0) result.flm = v;
  }

  // ANTAL PALL / Cll (colli)
  m = text.match(/(?:antal\s*pall|pallets?)\s*[:\-]?\s*(\d+)/i)
   || text.match(/\bCll\s*[:\-]?\s*(\d+)/i)
   || text.match(/\b(\d+)\s*(?:st\s*)?(?:pall(?:ar|etter|s)?|colli|kolli)\b/i)
   || text.match(/\bpall\s*[:\-]?\s*(\d+)/i);
  if (m) {
    const v = parseInt(m[1], 10);
    if (!isNaN(v) && v > 0) result.pallets = v;
  }

  // PRIS
  m = text.match(/(?:pris|price|kostnad)\s*[:\-]?\s*([\d\s.,]+)\s*(?:kr|sek)/i)
   || text.match(/([\d\s.,]+)\s*(?:kr|sek)\b/i);
  if (m) {
    const v = parseFloat(m[1].replace(/\s/g, '').replace(',', '.'));
    if (!isNaN(v) && v > 0) result.price = Math.round(v);
  }

  // FORDONSKRAV — DHL har "HAZ: Yes/No" för farligt gods
  result.adr = /\bADR\b/i.test(text) || /\bHAZ\s*:\s*Yes\b/i.test(text);
  result.tailLift = /(bakgavellift|baklift|tail\s*lift)/i.test(text);
  result.openSide = /(öppningsbar|oppningsbar|open\s*side|capell|gardin|sidogardiner)/i.test(text);

  // BESKRIVNING — kombinera ev. nyttig info: ref, remarks osv.
  const descParts = [];
  m = text.match(/(?:beskrivning|kommentar|info|gods|last|Load-Remarks|UnLoad-Remarks)\s*[:\-]\s*([^\n]+)/i);
  if (m && m[1].trim()) descParts.push(m[1].trim());
  m = text.match(/Consref\s*[:\-]?\s*([^\n]+)/i);
  if (m && m[1].trim()) descParts.push('Ref: ' + m[1].trim());
  m = text.match(/Ext\.Ref\s*[:\-]?\s*([^\n]+)/i);
  if (m && m[1].trim()) descParts.push('Ext.Ref: ' + m[1].trim());
  if (descParts.length) result.description = descParts.join(' · ').slice(0, 240);

  return result;
}

async function migrateLegacyRoles() {
  if (localStorage.getItem('legacyRolesMigrated') === '1') return;
  const users = await db.all('users');
  let changed = 0;
  for (const x of users) {
    if (x.role === 'transportkopare') {
      x.role = 'akare';
      await db.put('users', x);
      changed++;
    }
  }
  localStorage.setItem('legacyRolesMigrated', '1');
  if (changed > 0) console.log(`[migrate] Migrerade ${changed} transportkopare → akare`);
}

async function cleanupOrphanedBookings() {
  if (localStorage.getItem('orphanCleanupDone') === '1') return;
  const users = await db.all('users');
  const validIds = new Set(users.map(u => u.id));
  const bookings = await db.all('bookings');
  let removed = 0;
  for (const b of bookings) {
    const buyerMissing = !validIds.has(b.buyerId);
    const haulerMissing = b.haulerId && !validIds.has(b.haulerId);
    if (buyerMissing || haulerMissing) {
      const msgs = await db.byIndex('messages', 'bookingId', b.id);
      for (const m of msgs) await db.del('messages', m.id);
      await db.del('bookings', b.id);
      removed++;
    }
  }
  localStorage.setItem('orphanCleanupDone', '1');
  if (removed > 0) console.log(`[cleanup] Tog bort ${removed} bokningar med ogiltig uppdragsgivare/åkare`);
}

// --------- Prenumerationsmodell ---------
// 1-5 bilar: 995 kr / mån (exkl moms)
// 6-15 bilar: 1 995 kr / mån
// 16-30+ bilar: 2 495 kr / mån
const VAT_RATE = 0.25;
const TRIAL_DAYS = 14;
const DEFAULT_PRICING_TIERS = [
  { min: 1,  max: 5,  price: 995  },
  { min: 6,  max: 15, price: 1995 },
  { min: 16, max: 30, price: 2495 },
];
let PRICING_TIERS = loadPricingTiers();

function loadPricingTiers() {
  try {
    const raw = localStorage.getItem('pricingTiers');
    if (!raw) return DEFAULT_PRICING_TIERS.map(t => ({ ...t }));
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0) return DEFAULT_PRICING_TIERS.map(t => ({ ...t }));
    return parsed.filter(t => t && typeof t.min === 'number' && typeof t.max === 'number' && typeof t.price === 'number');
  } catch { return DEFAULT_PRICING_TIERS.map(t => ({ ...t })); }
}
function savePricingTiers(tiers) {
  const cleaned = tiers
    .map(t => ({ min: Number(t.min), max: Number(t.max), price: Number(t.price) }))
    .filter(t => !isNaN(t.min) && !isNaN(t.max) && !isNaN(t.price) && t.min > 0 && t.max >= t.min && t.price >= 0)
    .sort((a, b) => a.min - b.min);
  if (cleaned.length === 0) throw new Error('Minst en prisnivå krävs');
  localStorage.setItem('pricingTiers', JSON.stringify(cleaned));
  PRICING_TIERS = cleaned;
}
function resetPricingTiers() {
  localStorage.removeItem('pricingTiers');
  PRICING_TIERS = DEFAULT_PRICING_TIERS.map(t => ({ ...t }));
}
function tierFor(vehicleCount) {
  if (!vehicleCount || vehicleCount < 1) return null;
  const t = PRICING_TIERS.find(t => vehicleCount >= t.min && vehicleCount <= t.max);
  return t || PRICING_TIERS[PRICING_TIERS.length - 1]; // 30+ → högsta tariffen
}
function monthlyCostFor(vehicleCount, user) {
  if (user && user.manualMonthlyFee != null && user.manualMonthlyFee >= 0) {
    return Number(user.manualMonthlyFee);
  }
  const t = tierFor(vehicleCount);
  return t ? t.price : 0;
}
function tierLabelFor(vehicleCount) {
  const t = tierFor(vehicleCount);
  if (!t) return 'Ingen bil registrerad';
  return `${t.min}–${t.max === 30 ? '30+' : t.max} bilar`;
}
function trialEndsAt(user) {
  if (!user || !user.createdAt) return 0;
  const ms = typeof user.createdAt === 'number' ? user.createdAt : new Date(user.createdAt).getTime();
  if (isNaN(ms)) return 0;
  return ms + TRIAL_DAYS * 86400000;
}
function trialDaysLeft(user) {
  const end = trialEndsAt(user);
  if (!end) return 0;
  const ms = end - Date.now();
  return Math.max(0, Math.ceil(ms / 86400000));
}
function isTrialActive(user) {
  return trialDaysLeft(user) > 0;
}
function subscriptionStatusFor(user) {
  if (!user) return 'none';
  if (user.subscriptionActive === true) return 'paid';
  if (isTrialActive(user)) return 'trial';
  return 'expired';
}

}

// Tar bort telefonnummer och e-post från fri text (används i chatt innan accept)
// Anti-kringgående: regex för e-post, telefon, företagsformer, websidor
const COMPANY_RE = /\b(?:[A-ZÅÄÖ][\wÅÄÖåäö&'.\-]{1,}\s+){0,3}(?:AB|Aktiebolag|HB|KB|AS|A\/S|ApS|Oy|Inc|Ltd|GmbH|Åkeri|Transport|Logistik|Speditions?)\b/g;
const URL_RE = /\b(?:https?:\/\/|www\.)\S+|\b[\w-]+\.(?:se|com|net|org|nu|eu|dk|no|fi)\b/gi;
const EMAIL_RE = /\b[\w.+-]+@[\w-]+\.[\w.-]+\b/g;
const PHONE_RE = /(\+?\d[\d\s\-()]{5,}\d)/g;
function detectContact(text, knownNames = []) {
  if (!text) return { hits: [], masked: text };
  let masked = text;
  const hits = [];
  if (EMAIL_RE.test(text))   hits.push('e-post');
  if (PHONE_RE.test(text))   hits.push('telefon');
  if (URL_RE.test(text))     hits.push('webbadress');
  if (COMPANY_RE.test(text)) hits.push('företagsnamn');
  for (const n of knownNames) {
    if (!n) continue;
    const re = new RegExp('\\b' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    if (re.test(text)) { hits.push('namn'); break; }
  }
  // återanvänd regexarna för maskning (måste skapa nya pga global state)
  masked = masked.replace(/\b[\w.+-]+@[\w-]+\.[\w.-]+\b/g, '[***]');
  masked = masked.replace(/(\+?\d[\d\s\-()]{5,}\d)/g, m => m.replace(/\D/g, '').length >= 6 ? '[***]' : m);
  masked = masked.replace(/\b(?:https?:\/\/|www\.)\S+|\b[\w-]+\.(?:se|com|net|org|nu|eu|dk|no|fi)\b/gi, '[***]');
  masked = masked.replace(/\b(?:[A-ZÅÄÖ][\wÅÄÖåäö&'.\-]{1,}\s+){0,3}(?:AB|Aktiebolag|HB|KB|AS|A\/S|ApS|Oy|Inc|Ltd|GmbH|Åkeri|Transport|Logistik|Speditions?)\b/g, '[***]');
  for (const n of knownNames) {
    if (!n) continue;
    const re = new RegExp('\\b' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    masked = masked.replace(re, '[***]');
  }
  return { hits: [...new Set(hits)], masked };
}
function redactContact(text) { return detectContact(text).masked; }

function toast(msg, type) {
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function blobToUrl(blobOrUrl) {
  if (!blobOrUrl) return null;
  if (typeof blobOrUrl === 'string') return blobOrUrl;
  if (blobOrUrl instanceof Blob) return URL.createObjectURL(blobOrUrl);
  return null;
}

// --------- Router (hash-baserad) ---------
const routes = [];
function route(pattern, handler) { routes.push({ pattern, handler }); }

function navigate(path) {
  if (location.hash.slice(1) === path) render();
  else location.hash = path;
}

async function render() {
  const hash = location.hash.slice(1) || '/';
  const user = currentUser();

  // Hämta unread-count i bakgrunden — blockerar INTE navigeringen.
  // När svaret kommer uppdateras bara badge:n i DOM:en.
  if (user) {
    unreadCount(user.id).then(c => {
      _unreadCache = c;
      updateBellBadge(c);
    }).catch(() => {});
  } else {
    _unreadCache = 0;
  }

  // Publika rutter (utan inlogg)
  const publicHashes = ['/', '/login', '/register', '/signup'];
  const isPublicMagicLink = /^\/(r|opt-out|launch|accept-driver)\/[a-f0-9]+$/.test(hash);
  if (!user && !publicHashes.includes(hash) && !isPublicMagicLink) {
    return navigate('/');
  }
  if (user && (hash === '/login' || hash === '/register' || hash === '/signup')) {
    return navigate('/');
  }

  // Omedelbar feedback att klicket tagits emot:
  // - Om befintligt innehåll finns: dimma det (ingen flicker)
  // - Om sidan är tom: visa spinner
  const appEl = document.getElementById('app');
  if (appEl) {
    const existingMain = appEl.querySelector('main');
    if (existingMain) {
      existingMain.style.opacity = '0.45';
      existingMain.style.transition = 'opacity 0.12s';
      existingMain.style.pointerEvents = 'none';
    } else if (hash !== '/' && hash !== '/login') {
      appEl.innerHTML = '<main><div style="display:flex;align-items:center;justify-content:center;padding:60px 20px;color:#6b7280"><span style="display:inline-block;width:18px;height:18px;border:2px solid #e5e7eb;border-top-color:#f97316;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:10px"></span>Laddar...</div></main>';
    }
  }

  for (const r of routes) {
    const m = hash.match(r.pattern);
    if (m) {
      try { await r.handler(m, user); }
      catch (e) { console.error(e); toast(e.message || 'Fel uppstod', 'err'); }
      return;
    }
  }
  document.getElementById('app').innerHTML = `<main><div class="card"><h2>Sidan hittades inte</h2><a href="#/">Gå till start</a></div></main>`;
}

// Uppdaterar bara badge:n utan att re-rendera hela sidan
function updateBellBadge(count) {
  const bell = document.querySelector('header.topbar a[href="#/notifications"]');
  if (!bell) return;
  let badge = bell.querySelector('.bell-badge');
  if (count > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'bell-badge';
      bell.appendChild(badge);
    }
    badge.textContent = count;
  } else if (badge) {
    badge.remove();
  }
}

// Global AudioContext (skapas en gång, återanvänds) — kringgår autoplay-blockad
let _audioCtx = null;
function getAudioCtx() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!_audioCtx) _audioCtx = new Ctx();
    if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(() => {});
    return _audioCtx;
  } catch (e) {
    console.warn('AudioContext-fel:', e);
    return null;
  }
}
// Lås upp ljud vid första användarinteraktion (krävs av Chrome/Safari)
function unlockAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}
document.addEventListener('click', unlockAudio, { capture: true });
document.addEventListener('keydown', unlockAudio, { capture: true });
document.addEventListener('touchstart', unlockAudio, { capture: true });

function playNotificationSound() {
  if (!isSoundEnabled()) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    function beep(freq, when, duration, vol = 0.45) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t0 = ctx.currentTime + when;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    }
    // Tre-tonigt "DING-DING-DING" — tydligt och uppmärksamhetsfångande
    beep(880, 0, 0.18);
    beep(1100, 0.20, 0.18);
    beep(1320, 0.40, 0.30);
  } catch (e) {
    console.warn('Notifikationsljud-fel:', e);
  }
}

function mount(html) {
  document.getElementById('app').innerHTML = layout(html);
  const lo = document.getElementById('logout-link');
  if (lo) lo.onclick = async e => { e.preventDefault(); await supabaseLogout(); closeNav(); navigate('/login'); };

  // Sound-toggle: klicka för att slå på/av notifikationsljud
  const soundBtn = document.getElementById('sound-toggle');
  if (soundBtn) soundBtn.onclick = (e) => {
    e.preventDefault();
    const newState = !isSoundEnabled();
    setSoundEnabled(newState);
    toast(newState ? '🔊 Notifikationsljud påslaget' : '🔇 Notifikationsljud avstängt');
    if (newState) playNotificationSound(); // ge en bekräftelse-ding
  };

  // Hamburgarmeny på mobil
  const burger = document.getElementById('hamburger');
  const nav = document.getElementById('topnav');
  const backdrop = document.getElementById('nav-backdrop');
  const toggleNav = () => {
    const open = nav.classList.toggle('open');
    backdrop.classList.toggle('open', open);
    if (burger) burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.body.style.overflow = open ? 'hidden' : '';
  };
  window.closeNav = () => {
    nav?.classList.remove('open');
    backdrop?.classList.remove('open');
    if (burger) burger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  };
  if (burger) burger.onclick = toggleNav;
  if (backdrop) backdrop.onclick = window.closeNav;
  // Stäng menyn när man klickar på en länk
  nav?.querySelectorAll('a').forEach(a => {
    if (a.id === 'logout-link') return;
    a.addEventListener('click', () => window.closeNav());
  });
}

async function speditorOnboardingCall(token, action) {
  const url = `${SUPABASE_URL}/functions/v1/speditor-onboarding${action ? `?action=${action}` : ''}`;

    headers: { 'Content-Type': 'application/json' },

  return resp.json();
}

route(/^\/invoices$/, async (_m, u) => {
  if (!u) return navigate('/');
  // Hämta alla completed bokningar där användaren är köpare (eller åkare)
  const all = await db.byIndex('bookings', 'buyerId', u.id);
  const accepted = await db.byIndex('bookings', 'haulerId', u.id);
  const map = new Map();
  for (const b of all) if (b.status === 'completed') map.set(b.id, { ...b, _role: 'buyer' });
  for (const b of accepted) if (b.status === 'completed') {
    if (!map.has(b.id)) map.set(b.id, { ...b, _role: 'hauler' });
  }
  const allBookings = [...map.values()].sort((a, b) => new Date(b.completedAt || 0).getTime() - new Date(a.completedAt || 0).getTime());

  // Datumfilter (från sessionStorage)
  const fromFilter = sessionStorage.getItem('invoiceFrom') || '';
  const toFilter = sessionStorage.getItem('invoiceTo') || '';
  const filteredBookings = allBookings.filter(b => {
    const d = b.completedAt ? b.completedAt.slice(0, 10) : '';
    if (fromFilter && d < fromFilter) return false;
    if (toFilter && d > toFilter) return false;
    return true;
  });

  // Förbered datum för snabb-knappar
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0, 10);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().slice(0, 10);
  const lastMonthStart = new Date(today.getFullYear(), today.getMonth() - 1, 1).toISOString().slice(0, 10);
  const lastMonthEnd = new Date(today.getFullYear(), today.getMonth(), 0).toISOString().slice(0, 10);
  const yearStart = new Date(today.getFullYear(), 0, 1).toISOString().slice(0, 10);

  // Räkna totalt pris i filterperioden
  const totalPrice = filteredBookings.reduce((s, b) => s + (b.price || 0), 0);

  mount(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
      <a href="#/" class="btn secondary">← Tillbaka</a>
      <h2 style="margin:0">📄 Fakturaunderlag</h2>
      <span class="muted">${filteredBookings.length} av ${allBookings.length} utförda körning${allBookings.length === 1 ? '' : 'ar'}</span>
    </div>
    <div class="banner info">Här finns alla utförda körningar med PDF-fakturaunderlag som innehåller bokningsdetaljer, parter och fraktsedel. Använd för bokföring eller skicka till din kund.</div>

    ${allBookings.length === 0 ? `<div class="card"><div class="empty">Inga utförda körningar än. När en bokning markeras som utförd visas den här.</div></div>` : `
      <div class="card" style="margin-bottom:14px">
        <h3 style="margin-top:0">📅 Period</h3>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:12px">
          <div>
            <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Från</label>
            <input type="date" id="invFrom" value="${esc(fromFilter)}" style="padding:8px;border:1px solid var(--line);border-radius:6px">
          </div>
          <div>
            <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Till</label>
            <input type="date" id="invTo" value="${esc(toFilter)}" style="padding:8px;border:1px solid var(--line);border-radius:6px">
          </div>
          <button class="secondary" id="invApply">🔍 Filtrera</button>
          ${fromFilter || toFilter ? `<button class="secondary" id="invClear">✕ Rensa filter</button>` : ''}
        </div>
        <div class="btn-row" style="margin-bottom:0">
          <button class="secondary" data-quick="month">Denna månad</button>
          <button class="secondary" data-quick="lastmonth">Förra månaden</button>
          <button class="secondary" data-quick="year">I år</button>
          <button class="secondary" data-quick="all">Alla</button>
        </div>
        ${filteredBookings.length > 0 ? `<div class="muted" style="margin-top:14px;font-size:13px">
          <b>${filteredBookings.length}</b> körningar · Total: <b>${fmtMoney(totalPrice)}</b> (exkl. moms)
        </div>` : ''}
      </div>

      <div class="card">
        <div class="btn-row" style="margin-bottom:12px">
          <button id="zipAllBtn" style="background:#f97316;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer" ${filteredBookings.length === 0 ? 'disabled' : ''}>📦 Ladda ned alla som ZIP (${filteredBookings.length} PDF)</button>
          <a class="btn secondary" href="#/integrations">⚡ Integrationer (Fortnox/Visma)</a>
        </div>
        ${filteredBookings.length === 0 ? `<div class="empty">Inga körningar matchar valt datumintervall.</div>` : `
        <table class="compact">
          <thead><tr><th>Datum</th><th>Från → Till</th><th>Pris</th><th>Motpart</th><th>Roll</th><th></th></tr></thead>
          <tbody>
          ${filteredBookings.map(b => `<tr data-id="${b.id}">
            <td class="nowrap">${b.completedAt ? new Date(b.completedAt).toLocaleDateString('sv-SE') : '—'}</td>
            <td><b>${esc(b.fromLocation)}</b> → <b>${esc(b.toLocation)}</b></td>
            <td class="nowrap">${b.price ? fmtMoney(b.price) : '—'}</td>
            <td>${esc(b._role === 'buyer' ? '(åkare)' : '(uppdragsgivare)')}</td>
            <td><span class="badge ${b._role === 'buyer' ? 'open' : 'accepted'}">${b._role === 'buyer' ? 'Köpt' : 'Utfört'}</span></td>
            <td class="nowrap"><button class="secondary pdf-btn" data-bid="${b.id}">📄 PDF</button></td>
          </tr>`).join('')}
          </tbody>
        </table>`}
      </div>
    `}
  `);

  // Datumfilter-handlers
  const applyFilter = (from, to) => {
    if (from) sessionStorage.setItem('invoiceFrom', from); else sessionStorage.removeItem('invoiceFrom');
    if (to) sessionStorage.setItem('invoiceTo', to); else sessionStorage.removeItem('invoiceTo');
    navigate('/invoices');
  };
  const applyBtn = document.getElementById('invApply');
  if (applyBtn) applyBtn.onclick = () => {
    applyFilter(document.getElementById('invFrom').value, document.getElementById('invTo').value);
  };
  const clearBtn = document.getElementById('invClear');
  if (clearBtn) clearBtn.onclick = () => applyFilter('', '');

  document.querySelectorAll('button[data-quick]').forEach(btn => {
    btn.onclick = () => {
      const q = btn.dataset.quick;
      if (q === 'month') applyFilter(monthStart, monthEnd);
      else if (q === 'lastmonth') applyFilter(lastMonthStart, lastMonthEnd);
      else if (q === 'year') applyFilter(yearStart, todayStr);
      else if (q === 'all') applyFilter('', '');
    };
  });

  // Enskild PDF-knapp
  document.querySelectorAll('.pdf-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.bid;
      btn.disabled = true; btn.textContent = '⏳';
      try {
        const b = filteredBookings.find(x => x.id === id);
        const buyer = await db.get('users', b.buyerId);
        const hauler = b.haulerId ? await db.get('users', b.haulerId) : null;
        const doc = await generateInvoicePDF(b, buyer, hauler);
        doc.save(safeFileName(`fakturaunderlag-${b.fromLocation}-${b.toLocation}-${b.id.slice(0,8)}`) + '.pdf');
      } catch (err) {
        console.error('PDF-fel:', err);
        toast('PDF-fel: ' + (err.message || err), 'err');
      } finally {
        btn.disabled = false; btn.textContent = '📄 PDF';
      }
    };
  });

  // ZIP-nedladdningsknapp
  const zipBtn = document.getElementById('zipAllBtn');
  if (zipBtn && filteredBookings.length > 0) zipBtn.onclick = async () => {
    zipBtn.disabled = true;
    zipBtn.textContent = `⏳ Bygger ZIP (1 av ${filteredBookings.length})...`;
    try {
      const zip = new JSZip();
      for (let i = 0; i < filteredBookings.length; i++) {
        const b = filteredBookings[i];
        zipBtn.textContent = `⏳ Bygger ZIP (${i + 1} av ${filteredBookings.length})...`;
        const bk = await db.get('users', b.buyerId);
        const hl = b.haulerId ? await db.get('users', b.haulerId) : null;
        const doc = await generateInvoicePDF(b, bk, hl);
        const blob = doc.output('blob');
        const fname = safeFileName(`${b.completedAt ? b.completedAt.slice(0,10) : 'okand'}_${b.fromLocation}_${b.toLocation}_${b.id.slice(0,8)}`) + '.pdf';
        zip.file(fname, blob);
      }
      zipBtn.textContent = '⏳ Komprimerar...';
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      // Filnamn baserat på period
      const fromLabel = fromFilter || (filteredBookings[filteredBookings.length - 1]?.completedAt || '').slice(0, 10) || 'start';
      const toLabel = toFilter || (filteredBookings[0]?.completedAt || todayStr).slice(0, 10);
      a.download = `fakturaunderlag_${fromLabel}_till_${toLabel}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast(`✅ ZIP med ${filteredBookings.length} PDF nedladdat`);
    } catch (err) {
      console.error('ZIP-fel:', err);
      toast('ZIP-fel: ' + (err.message || err), 'err');
    } finally {
      zipBtn.disabled = false;
      zipBtn.textContent = `📦 Ladda ned alla som ZIP (${filteredBookings.length} PDF)`;
    }
  };
});

  document.getElementById('landing-logo-tap').onclick = () => {
    logoClicks++;
    if (logoClicks >= 5) navigate('/login');
  };

  // Submit handler — bara om formuläret finns (innan lansering)
  const waitlistForm = document.getElementById('waitlist-form');
  if (!waitlistForm) return;
  waitlistForm.onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    btn.disabled = true;
    btn.textContent = 'Sparar…';
    try {
      const f = new FormData(e.target);
      const email = (f.get('email') || '').toLowerCase().trim();
      if (!email) throw new Error('E-post saknas');

      // Kolla först om e-posten redan finns (case-insensitive)
      const { error } = await sb.from('waitlist').insert({
        email,
        name: (f.get('name') || '').trim() || null,
        company: (f.get('company') || '').trim() || null,
        organization_number: (f.get('organization_number') || '').trim() || null,
        phone: (f.get('phone') || '').trim() || null,
        role: (f.get('role') || '').trim() || null,
        fleet_size: f.get('fleet_size') || null,
        source: 'landing',
      });

      if (error) {
        if (/duplicate|unique/i.test(error.message)) {
          throw new Error('Den här e-postadressen står redan på listan. Du hör av oss vid lansering!');
        }
        throw error;
      }

      // Success-state
      document.getElementById('signup-area').innerHTML = `
        <div class="landing-success">
          <h3>🎉 Du är inne!</h3>
          <p>Vi har sparat din anmälan och hör av oss till <b>${esc(email)}</b> innan lansering den 1 juli.</p>
        </div>`;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sätt mig på listan →';
      alert(err.message || 'Något gick fel. Försök igen.');
    }
  };
}

// Sammanslagen dashboard: alla inloggade ser sina egna publicerade + tillgängliga + accepterade
async function unifiedDashboard(u) {
  const allMine = await db.byIndex('bookings', 'buyerId', u.id);
  const accepted = await db.byIndex('bookings', 'haulerId', u.id);
  const open = await db.byIndex('bookings', 'status', 'open');
  const available = open.filter(b => b.buyerId !== u.id);

  applySort(allMine);
  applySort(available);
  accepted.sort((a, b) => (b.acceptedAt || 0) - (a.acceptedAt || 0));

  const sortKey = getSortKey();
  const sortOpts = Object.entries(SORT_OPTIONS).map(([k,v]) => `<option value="${k}" ${k===sortKey?'selected':''}>${v.label}</option>`).join('');

  const myByStatus = { open: [], accepted: [], completed: [] };
  allMine.forEach(b => myByStatus[b.status]?.push(b));

  const accByStatus = { accepted: [], completed: [] };
  accepted.forEach(b => accByStatus[b.status]?.push(b));
  const totalEarned = accByStatus.completed.reduce((s, b) => s + ((b.price || 0) - (b.commission || 0)), 0);

  // Aktiva publicerade (ej utförda) — dessa visas under "Mina publicerade körningar"
  const myActive = allMine.filter(b => b.status !== 'completed');
  // Aktiva accepterade (ej utförda) — dessa visas under "Uppdrag jag accepterat"
  const accAcceptedActive = accepted.filter(b => b.status !== 'completed');
  // Alla utförda (egna publicerade + egna accepterade) — dedupliceras via id
  const completedSet = new Map();
  for (const b of myByStatus.completed) completedSet.set(b.id, b);
  for (const b of accByStatus.completed) completedSet.set(b.id, b);
  const myCompletedAll = [...completedSet.values()].sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

  // Trial-banner för åkare
  let trialBanner = '';
  if (u.role === 'akare') {
    const fresh = await db.get('users', u.id);
    const status = subscriptionStatusFor(fresh);
    const days = trialDaysLeft(fresh);
    if (status === 'trial') {
      trialBanner = `<div class="banner info">🎁 Du har <b>${days} ${days === 1 ? 'dag' : 'dagar'} kvar</b> av din kostnadsfria provperiod (14 dagar). <a href="#/subscription">Se prislista →</a></div>`;
    } else if (status === 'expired') {
      trialBanner = `<div class="banner err">⚠ Din provperiod har gått ut. <a href="#/subscription">Aktivera prenumeration →</a></div>`;
    }
  }

  // Bygg avsändar-map för admin (visas i Tillgängliga körningar-sektionen)
  const senderMap = await buildSenderMap(u, [...available, ...myActive, ...accAcceptedActive]);

  mount(`
    <h2>Hej ${esc(u.name)}!</h2>
    ${trialBanner}
    <div class="btn-row">
      <a class="btn" href="#/new">➕ Skapa ny körning</a>
      ${allMine.some(b => b.sourceRef) ? `<button class="btn danger" id="clearImportedBtn" style="margin:0">🗑 Rensa importerade (${allMine.filter(b => b.sourceRef).length})</button>` : ''}
      <label class="btn secondary" style="margin:0;display:inline-flex;align-items:center;gap:8px;cursor:pointer">
        ↕ Sortera:
        <select id="sortSelect" style="border:none;background:transparent;color:inherit;font:inherit;cursor:pointer">${sortOpts}</select>
      </label>
    </div>
    <div class="stats">
      <a class="stat" href="#/mine/open" style="text-decoration:none;color:inherit;cursor:pointer"><div class="val">${myByStatus.open.length}</div><div class="lbl">Mina öppna</div></a>
      <a class="stat" href="#/mine/active" style="text-decoration:none;color:inherit;cursor:pointer"><div class="val">${myByStatus.accepted.length + accByStatus.accepted.length}</div><div class="lbl">Pågående uppdrag</div></a>
      <a class="stat" href="#/mine/completed" style="text-decoration:none;color:inherit;cursor:pointer"><div class="val">${myCompletedAll.length}</div><div class="lbl">Mina utförda</div></a>
      <a class="stat" href="#/mine/earned" style="text-decoration:none;color:inherit;cursor:pointer"><div class="val">${fmtMoney(totalEarned)}</div><div class="lbl">Netto utförda</div></a>
    </div>

    <div class="card">
      <h3>📋 Tillgängliga körningar (${available.length})</h3>
      <div class="muted" style="margin-bottom:8px">Acceptera ett uppdrag — kontaktuppgifter visas efter accept.</div>
      ${available.length === 0 ? `<div class="empty">Inga öppna körningar från andra just nu.</div>` : renderBookingTable(available, 'hauler', senderMap)}
    </div>

    <div class="card">
      <h3>📝 Mina publicerade körningar (${myActive.length})</h3>
      <div class="muted" style="margin-bottom:8px;font-size:12px">Aktuella uppdrag (öppna och pågående). Utförda hamnar längre ner.</div>
      ${myActive.length === 0 ? `<div class="empty">Du har inga aktiva publicerade körningar.</div>` : renderBookingTable(myActive, 'buyer', senderMap)}
    </div>

    ${accAcceptedActive.length > 0 ? `<div class="card">
      <h3>🚛 Uppdrag jag accepterat (${accAcceptedActive.length})</h3>
      ${renderBookingTable(accAcceptedActive, 'hauler', senderMap)}
    </div>` : ''}
  `);
  bindRowClicks();
  bindClearImported(u);
  const ss = document.getElementById('sortSelect');
  if (ss) ss.onchange = () => { setSortKey(ss.value); unifiedDashboard(u); };
}

// --------- Mina körningar (filtrerad vy från klick på stat-rutorna) ---------
route(/^\/mine\/(open|active|completed|earned)$/, async (m, u) => {
  if (!u || u.role === 'chauffor') return navigate('/');
  const filter = m[1];
  const allMine = await db.byIndex('bookings', 'buyerId', u.id);
  const accepted = await db.byIndex('bookings', 'haulerId', u.id);

  let list = [];
  let title = '';
  let helper = '';
  let perspective = 'buyer';

  if (filter === 'open') {
    list = allMine.filter(b => b.status === 'open');
    title = '📂 Mina öppna körningar';
    helper = 'Körningar du publicerat och som väntar på åkare.';
    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  } else if (filter === 'active') {
    const myPending = allMine.filter(b => b.status === 'accepted');
    const accPending = accepted.filter(b => b.status === 'accepted');
    const seen = new Map();
    for (const b of [...myPending, ...accPending]) seen.set(b.id, b);
    list = [...seen.values()].sort((a, b) => (b.acceptedAt || 0) - (a.acceptedAt || 0));
    title = '🚛 Pågående uppdrag';
    helper = 'Accepterade uppdrag som ännu inte är slutförda — både dina publicerade och de du själv kör.';
  } else if (filter === 'completed') {
    const myDone = allMine.filter(b => b.status === 'completed');
    const accDone = accepted.filter(b => b.status === 'completed');
    const seen = new Map();
    for (const b of [...myDone, ...accDone]) seen.set(b.id, b);
    list = [...seen.values()].sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
    title = '✅ Mina utförda körningar';
    helper = 'Körningar du publicerat eller utfört som markerats som klara.';
  } else if (filter === 'earned') {
    list = accepted.filter(b => b.status === 'completed');
    list.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
    title = '💰 Netto utförda (intjänat)';
    const total = list.reduce((s, b) => s + ((b.price || 0) - (b.commission || 0)), 0);
    helper = `Totalt intjänat: <b>${fmtMoney(total)}</b> från ${list.length} utförd${list.length === 1 ? '' : 'a'} uppdrag som åkare.`;
    perspective = 'hauler';
  }

  mount(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <a href="#/" class="btn secondary">← Tillbaka till dashboard</a>
      <h2 style="margin:0">${title}</h2>
    </div>
    <div class="muted" style="margin-bottom:12px">${helper}</div>
    <div class="card">
      ${list.length === 0 ? `<div class="empty">Inga körningar i denna kategori.</div>` : renderBookingTable(list, perspective)}
    </div>
  `);
  bindRowClicks();
});

// --------- Köpare: Dashboard ---------
const SORT_OPTIONS = {
  'from-asc':  { label: 'Avgångsort A–Ö', fn: (a,b,c) => c.compare(a.fromLocation||'', b.fromLocation||'') },
  'from-desc': { label: 'Avgångsort Ö–A', fn: (a,b,c) => c.compare(b.fromLocation||'', a.fromLocation||'') },
  'to-asc':    { label: 'Mål-ort A–Ö',    fn: (a,b,c) => c.compare(a.toLocation||'', b.toLocation||'') },
  'date-asc':  { label: 'Lastdatum ↑',    fn: (a,b) => (a.loadDate||'9999').localeCompare(b.loadDate||'9999') },
  'date-desc': { label: 'Lastdatum ↓',    fn: (a,b) => (b.loadDate||'0').localeCompare(a.loadDate||'0') },
  'price-desc':{ label: 'Pris (högst)',   fn: (a,b) => (b.price||0) - (a.price||0) },
  'recent':    { label: 'Senast skapad',  fn: (a,b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime() },
};
function getSortKey() { return localStorage.getItem('sortKey') || 'from-asc'; }
function setSortKey(k) { localStorage.setItem('sortKey', k); }
function applySort(list) {
  const key = getSortKey();
  const cfg = SORT_OPTIONS[key] || SORT_OPTIONS['from-asc'];
  const coll = new Intl.Collator('sv', { sensitivity: 'base' });
  list.sort((a, b) => cfg.fn(a, b, coll));
  return list;
}
