function bindClearImported(u) {
  const btn = document.getElementById('clearImportedBtn');
  if (!btn) return;
  btn.onclick = async () => {
    const mine = await db.byIndex('bookings', 'buyerId', u.id);
    const imported = mine.filter(b => b.sourceRef);
    if (!imported.length) return;
    if (!confirm(`Ta bort ${imported.length} importerade körningar permanent?`)) return;
    let n = 0;
    for (const b of imported) {
      const msgs = await db.byIndex('messages', 'bookingId', b.id);
      for (const m of msgs) await db.del('messages', m.id);
      await db.del('bookings', b.id);
      n++;
    }
    toast(`Rensade ${n} importerade körningar`);
    location.hash = '#/';
  };
}

// Cell-hjälpare för Flm / Vikt / ppl
function cellFlm(b)     { return b.flm     ? `<b>${b.flm}</b>` : '<span class="muted">—</span>'; }
function cellVikt(b) {
  if (!b.weight) return '<span class="muted">—</span>';
  return b.weight >= 1000
    ? `<b>${(b.weight/1000).toLocaleString('sv-SE', {maximumFractionDigits:1})}</b> ton`
    : `<b>${b.weight.toLocaleString('sv-SE')}</b> kg`;
}
function cellPallplatser(b) { return b.pallets ? `<b>${b.pallets}</b>` : '<span class="muted">—</span>'; }

function renderBookingTable(list, perspective, senderMap) {
  const showSender = !!senderMap;
  function senderCell(b) {
    if (!b.senderInvitationId) return '<span class="muted">—</span>';
    const lbl = senderMap[b.senderInvitationId];
    return lbl ? `<span class="badge" style="background:#fed7aa;color:#9a3412;font-weight:600">${esc(lbl)}</span>` : '<span class="muted">?</span>';
  }
  return `<table>
    <thead><tr>
      <th>Från → Till</th>${showSender ? '<th>📨 Avsändare</th>' : ''}<th>Flm</th><th>Vikt</th><th>ppl</th><th>Lastning</th><th>Lossning</th><th>Pris</th>
      ${perspective === 'admin' ? '<th>Uppdragsgivare</th><th>Utförande åkare</th>' : ''}
      <th>Status</th>
    </tr></thead>
    <tbody>
    ${list.map(b => `
      <tr data-id="${b.id}" onclick="location.hash='#/booking/${b.id}'" style="cursor:pointer">
        <td><b>${esc(b.fromLocation)}</b> → <b>${esc(b.toLocation)}</b>
            <div style="margin-top:3px;white-space:nowrap">
              ${b.adr ? '<span class="badge feature">ADR</span>' : ''}
              ${b.tailLift ? '<span class="badge feature">Bakgavellift</span>' : ''}
              ${b.openSide ? '<span class="badge feature">Öppningsbar sida</span>' : ''}
            </div></td>
        ${showSender ? `<td>${senderCell(b)}</td>` : ''}
        <td class="nowrap">${cellFlm(b)}</td>
        <td class="nowrap">${cellVikt(b)}</td>
        <td class="nowrap" style="text-align:center">${cellPallplatser(b)}</td>
        <td>${esc(b.loadDate)} ${esc(b.loadTime || '')}</td>
        <td>${esc(b.unloadDate)} ${esc(b.unloadTime || '')}</td>
        <td>${fmtMoney(b.price)}</td>
        ${perspective === 'admin' ? `<td>${esc(b._buyerName || '?')}</td><td>${esc(b._haulerName || '—')}</td>` : ''}
        <td><span class="badge ${b.status}">${STATUS_LABEL[b.status]}</span></td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

// Hjälpare: bygg avsändar-map för admin (importerade bokningar)
async function buildSenderMap(u, allBookings) {
  if (u.role !== 'admin') return null;
  const invIds = [...new Set(allBookings.map(b => b.senderInvitationId).filter(Boolean))];
  if (invIds.length === 0) return null;
  try {
    const { data: invs } = await sb.from('speditor_invitations').select('id, name, company, email').in('id', invIds);
    const map = {};
    (invs || []).forEach(inv => {
      map[inv.id] = inv.company || inv.name || (inv.email ? inv.email.split('@')[1] : '?');
    });
    return map;
  } catch (err) {
    console.warn('Kunde inte hämta invitations:', err);
    return null;
  }
}

function bindRowClicks() {
  document.querySelectorAll('tr[data-id]').forEach(tr => {

  });
}

          <div class="field"><label>Lossningstid</label><input name="unloadTime" type="time"></div>

        </div>
        <div class="row">
          <div class="field"><label>Flakmeter (FLM/LDM) <span class="muted">— valfritt</span></label><input name="flm" type="number" min="0" step="0.1" placeholder="t.ex. 13.6"></div>
          <div class="field"><label>Antal pall <span class="muted">— valfritt</span></label><input name="pallets" type="number" min="0" step="1" placeholder="t.ex. 12"></div>
        </div>
        <div class="field"><label>Bild på bokning (valfritt)</label><input name="bookingImage" type="file" accept="image/*"></div>
        <h3 style="margin-top:12px">Krav på fordon</h3>
        <div class="row-3">
          <div class="check"><input type="checkbox" name="adr" id="cb-adr"><label for="cb-adr" style="margin:0">ADR (farligt gods)</label></div>
          <div class="check"><input type="checkbox" name="tailLift" id="cb-tl"><label for="cb-tl" style="margin:0">Bakgavellift</label></div>
          <div class="check"><input type="checkbox" name="openSide" id="cb-os"><label for="cb-os" style="margin:0">Öppningsbar sida</label></div>
        </div>
        <div class="field"><label>Beskrivning / kommentar (valfritt)</label><textarea name="description" placeholder="Last, antal pallar, särskilda instruktioner..."></textarea></div>
        <div class="btn-row">
          <button type="submit">Publicera körning</button>
          <a class="btn secondary" href="#/">Avbryt</a>
        </div>
      </form>
    </div>
  `);
  // Snabbifyll från mejl-text
  document.getElementById('aiClearBtn').onclick = () => {
    document.getElementById('aiPasteText').value = '';
    document.getElementById('aiResult').textContent = '';
  };
  document.getElementById('aiParseBtn').onclick = () => {
    const txt = document.getElementById('aiPasteText').value;
    if (!txt.trim()) { document.getElementById('aiResult').textContent = 'Klistra in text först.'; return; }
    const parsed = parseBookingFromText(txt);
    const form = document.getElementById('newForm');
    let filled = [];
    const set = (name, val) => {
      if (val == null || val === '') return;
      const el = form.elements[name];
      if (!el) return;
      if (el.type === 'checkbox') {
        if (val) { el.checked = true; filled.push(name); }
      } else {
        el.value = val;
        filled.push(name);
      }
    };
    set('fromLocation', parsed.fromLocation);
    set('toLocation', parsed.toLocation);
    set('fromPostal', parsed.fromPostal);
    set('toPostal', parsed.toPostal);
    set('loadDate', parsed.loadDate);
    set('loadTime', parsed.loadTime);
    set('unloadDate', parsed.unloadDate);
    set('unloadTime', parsed.unloadTime);
    set('weight', parsed.weight);
    set('flm', parsed.flm);
    set('pallets', parsed.pallets);
    set('price', parsed.price);
    set('adr', parsed.adr);
    set('tailLift', parsed.tailLift);
    set('openSide', parsed.openSide);
    set('description', parsed.description);
    document.getElementById('aiResult').textContent = filled.length
      ? `✅ Fyllde i ${filled.length} fält. Kontrollera och redigera vid behov.`
      : '⚠ Kunde inte tolka texten. Fyll i manuellt.';
  };

  document.getElementById('newForm').onsubmit = async e => {
    e.preventDefault();
    try {
      const f = new FormData(e.target);
      const file = f.get('bookingImage');
      let bookingImageUrl = null;
      if (file && file.size > 0) {
        bookingImageUrl = await uploadImage(file, 'booking-images');
      }
      const booking = {
        buyerId: u.id, haulerId: null,
        fromLocation: f.get('fromLocation').trim(),
        toLocation: f.get('toLocation').trim(),
        fromPostal: (f.get('fromPostal') || '').trim(),
        toPostal: (f.get('toPostal') || '').trim(),
        weight: f.get('weight') ? Number(f.get('weight')) : null,
        flm: f.get('flm') ? Number(f.get('flm')) : null,
        pallets: f.get('pallets') ? Number(f.get('pallets')) : null,
        loadDate: f.get('loadDate'), loadTime: f.get('loadTime') || null,
        unloadDate: f.get('unloadDate'), unloadTime: f.get('unloadTime') || null,
        adr: !!f.get('adr'), tailLift: !!f.get('tailLift'), openSide: !!f.get('openSide'),
        price: f.get('price') ? Number(f.get('price')) : null,
        description: (f.get('description') || '').trim(),
        bookingImageUrl,
        status: 'open', commission: 0,
        contactVisible: false,
      };
      const saved = await db.add('bookings', booking);
      toast('Körning publicerad');
      navigate('/booking/' + saved.id);
    } catch (err) {
      console.error('Skapa körning fel:', err);
      toast('Kunde inte publicera: ' + (err.message || err), 'err');
    }
  };
});

async function haulerDashboard(u) {
  const mine = await db.byIndex('bookings', 'haulerId', u.id);
  mine.sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
  const byStatus = { accepted: [], completed: [] };
  mine.forEach(b => { if (byStatus[b.status]) byStatus[b.status].push(b); });

  mount(`

      <div class="stat"><div class="val">${byStatus.completed.length}</div><div class="lbl">Utförda</div></div>
      <div class="stat"><div class="val">${fmtMoney(totalEarned)}</div><div class="lbl">Netto (utförda)</div></div>

// --------- Åkare: Tillgängliga körningar ---------
route(/^\/available$/, async (_m, u) => {
  if (!canAcceptAndPost(u)) { toast('Logga in för att se tillgängliga körningar', 'err'); return navigate('/'); }
  const allOpen = (await db.byIndex('bookings', 'status', 'open')).filter(b => b.buyerId !== u.id);
  applySort(allOpen);
  const sortKey = getSortKey();
  const sortOpts = Object.entries(SORT_OPTIONS).map(([k,v]) => `<option value="${k}" ${k===sortKey?'selected':''}>${v.label}</option>`).join('');

  // Admin: hämta avsändar-info för importerade bokningar (visas bara för admin)
  const invitationMap = {};
  if (u.role === 'admin') {
    const invIds = [...new Set(allOpen.map(b => b.senderInvitationId).filter(Boolean))];
    if (invIds.length > 0) {
      try {
        const { data: invs } = await sb.from('speditor_invitations').select('id, name, company, email').in('id', invIds);
        (invs || []).forEach(inv => {
          invitationMap[inv.id] = inv.company || inv.name || (inv.email ? inv.email.split('@')[1] : '?');
        });
      } catch (err) { console.warn('Kunde inte hämta invitations:', err); }
    }
  }
  function senderLabel(b) {
    if (!b.senderInvitationId) return '<span class="muted">—</span>';
    const lbl = invitationMap[b.senderInvitationId];
    return lbl ? `<span class="badge" style="background:#fed7aa;color:#9a3412;font-weight:600">${esc(lbl)}</span>` : '<span class="muted">?</span>';
  }

  // Admin: avsändar-filter
  const senderFilter = u.role === 'admin' ? (sessionStorage.getItem('availSenderFilter') || '') : '';
  let senderOptions = [];
  let manualCount = 0;
  if (u.role === 'admin') {
    const counts = {};
    allOpen.forEach(b => {
      if (b.senderInvitationId) counts[b.senderInvitationId] = (counts[b.senderInvitationId] || 0) + 1;
      else manualCount++;
    });
    senderOptions = Object.entries(counts)
      .map(([id, count]) => ({ id, count, label: invitationMap[id] || '?' }))
      .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
  }

  // Tillämpa filter
  const open = !senderFilter ? allOpen
    : senderFilter === 'manual' ? allOpen.filter(b => !b.senderInvitationId)
    : allOpen.filter(b => b.senderInvitationId === senderFilter);

  const filterBadge = senderFilter
    ? `<span style="background:#f97316;color:#fff;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-left:8px">filtrerad: ${open.length} av ${allOpen.length}</span>`
    : '';

  mount(`
    <h2>Tillgängliga körningar ${allOpen.length > 0 ? `<span class="muted" style="font-size:14px;font-weight:400">(${allOpen.length} st)</span>` : ''}${filterBadge}</h2>
    <div class="btn-row" style="flex-wrap:wrap;align-items:center">
      <label class="btn secondary" style="margin:0;display:inline-flex;align-items:center;gap:8px;cursor:pointer">
        ↕ Sortera:
        <select id="sortSelectAvail" style="border:none;background:transparent;color:inherit;font:inherit;cursor:pointer">${sortOpts}</select>
      </label>
      ${u.role === 'admin' && (senderOptions.length > 0 || manualCount > 0) ? `
        <label class="btn secondary" style="margin:0;display:inline-flex;align-items:center;gap:8px;cursor:pointer">
          📨 Avsändare:
          <select id="senderFilterSelect" style="border:none;background:transparent;color:inherit;font:inherit;cursor:pointer;max-width:280px">
            <option value="">Alla (${allOpen.length})</option>
            ${senderOptions.map(s => `<option value="${esc(s.id)}" ${s.id === senderFilter ? 'selected' : ''}>${esc(s.label)} (${s.count})</option>`).join('')}
            ${manualCount > 0 ? `<option value="manual" ${senderFilter === 'manual' ? 'selected' : ''}>Manuella (${manualCount})</option>` : ''}
          </select>
        </label>
        ${senderFilter ? `<button class="secondary" id="clearSenderFilterBtn" style="margin:0">✕ Rensa filter</button>` : ''}
      ` : ''}
      ${u.role === 'admin' && allOpen.length > 0 ? `<button class="danger" id="clearAllOpenBtn" style="margin-left:auto">🧹 Rensa alla tillgängliga</button>` : ''}
    </div>
    <div class="banner info">Kontaktuppgifter till uppdragsgivaren visas först när du accepterar uppdraget.</div>
    <div class="card">
      ${open.length === 0 ? `<div class="empty">${senderFilter ? 'Inga körningar matchar valt filter.' : 'Inga öppna körningar just nu.'}</div>`
      : `<table>
        <thead><tr>
          ${u.role === 'admin' ? `<th style="width:32px"><input type="checkbox" id="selectAllBookings" title="Markera alla"></th>` : ''}
          <th>Från → Till</th>${u.role === 'admin' ? '<th>📨 Avsändare</th>' : ''}<th>Flm</th><th>Vikt</th><th>ppl</th><th>Lastning</th><th>Lossning</th><th>Krav</th><th>Pris</th>${canSeeCommission(u) ? '<th>Netto åkare</th>' : ''}${u.role === 'admin' ? '<th></th>' : ''}
        </tr></thead>
        <tbody>
          ${open.map(b => `
            <tr data-id="${b.id}" data-route="${esc(b.fromLocation)} → ${esc(b.toLocation)}" onclick="location.hash='#/booking/${b.id}'" style="cursor:pointer">
              ${u.role === 'admin' ? `<td onclick="event.stopPropagation()" style="text-align:center"><input type="checkbox" class="booking-select" data-id="${b.id}"></td>` : ''}
              <td><b>${esc(b.fromLocation)}</b> → <b>${esc(b.toLocation)}</b></td>
              ${u.role === 'admin' ? `<td>${senderLabel(b)}</td>` : ''}
              <td class="nowrap">${cellFlm(b)}</td>
              <td class="nowrap">${cellVikt(b)}</td>
              <td class="nowrap" style="text-align:center">${cellPallplatser(b)}</td>
              <td>${esc(b.loadDate)} ${esc(b.loadTime || '')}</td>
              <td>${esc(b.unloadDate)} ${esc(b.unloadTime || '')}</td>
              <td class="nowrap">
                ${b.adr ? '<span class="badge feature">ADR</span>' : ''}
                ${b.tailLift ? '<span class="badge feature">Bakgavellift</span>' : ''}
                ${b.openSide ? '<span class="badge feature">Öppningsbar sida</span>' : ''}
                ${!b.adr && !b.tailLift && !b.openSide ? '<span class="muted">—</span>' : ''}
              </td>
              <td>${b.price == null ? '<span class="muted">Önskar prisförslag</span>' : fmtMoney(b.price)}</td>
              ${canSeeCommission(u) ? `<td>${b.price == null ? '<span class="muted">—</span>' : fmtMoney(nettoFor(b.price))}</td>` : ''}
              ${u.role === 'admin' ? `<td class="nowrap" style="text-align:right"><button class="danger icon-btn" data-delbooking="${b.id}" data-route="${esc(b.fromLocation)} → ${esc(b.toLocation)}" title="Radera bokning" onclick="event.stopPropagation()">🗑</button></td>` : ''}
            </tr>`).join('')}
        </tbody>
      </table>
      ${u.role === 'admin' ? `
        <div id="bulkActionBar" style="display:none;position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--brand);padding:12px 16px;margin:0 -14px -14px;display:none;align-items:center;gap:14px;flex-wrap:wrap">
          <strong id="bulkSelectedCount" style="color:var(--brand)">0 markerade</strong>
          <button class="danger" id="bulkDeleteBtn">🗑 Radera valda</button>
          <button class="secondary" id="bulkClearBtn">Avmarkera alla</button>
          <span class="muted" style="font-size:12px;margin-left:auto">⚠️ Tar även bort relaterade bud, meddelanden och notifikationer</span>
        </div>
      ` : ''}
      `}
    </div>
  `);
  bindRowClicks();
  const ss = document.getElementById('sortSelectAvail');
  if (ss) ss.onchange = () => { setSortKey(ss.value); navigate('/available'); };

  // Avsändar-filter event handlers (admin)
  const sf = document.getElementById('senderFilterSelect');
  if (sf) sf.onchange = () => {
    sessionStorage.setItem('availSenderFilter', sf.value);
    navigate('/available');
  };
  const clearSf = document.getElementById('clearSenderFilterBtn');
  if (clearSf) clearSf.onclick = () => {
    sessionStorage.removeItem('availSenderFilter');
    navigate('/available');
  };

  // Admin: enskild radering via 🗑-knapp (CASCADE i DB tar hand om bids/msgs/notifs)
  document.querySelectorAll('button[data-delbooking]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const id = btn.dataset.delbooking;
      const route = btn.dataset.route;
      if (!confirm(`Radera bokningen "${route}"?\n\nRelaterade bud, meddelanden och notifikationer tas också bort.\nKan inte ångras.`)) return;
      try {
        await db.del('bookings', id);
        toast(`Bokning "${route}" raderad`);
        // Rensa raden från DOM direkt (snabbare än reload)
        const tr = document.querySelector(`tr[data-id="${id}"]`);
        if (tr) tr.remove();
      } catch (err) {
        console.error('Radera bokning-fel:', err);
        toast('Kunde inte radera: ' + (err.message || err), 'err');
      }
    };
  });

  // Admin: bulk-selection
  if (u.role === 'admin') {
    const selectAll = document.getElementById('selectAllBookings');
    const checkboxes = document.querySelectorAll('.booking-select');
    const bar = document.getElementById('bulkActionBar');
    const counter = document.getElementById('bulkSelectedCount');
    const deleteBtn = document.getElementById('bulkDeleteBtn');
    const clearBtn = document.getElementById('bulkClearBtn');

    function getSelectedIds() {
      return Array.from(document.querySelectorAll('.booking-select:checked')).map(cb => cb.dataset.id);
    }
    function updateBar() {
      const ids = getSelectedIds();
      counter.textContent = `${ids.length} ${ids.length === 1 ? 'markerad' : 'markerade'}`;
      bar.style.display = ids.length > 0 ? 'flex' : 'none';
      if (selectAll) {
        selectAll.checked = ids.length === checkboxes.length && checkboxes.length > 0;
        selectAll.indeterminate = ids.length > 0 && ids.length < checkboxes.length;
      }
    }

    checkboxes.forEach(cb => cb.addEventListener('change', updateBar));
    if (selectAll) {
      selectAll.addEventListener('click', e => e.stopPropagation());
      selectAll.addEventListener('change', () => {
        checkboxes.forEach(cb => cb.checked = selectAll.checked);
        updateBar();
      });
    }
    clearBtn?.addEventListener('click', () => {
      checkboxes.forEach(cb => cb.checked = false);
      updateBar();
    });

    deleteBtn?.addEventListener('click', async () => {
      const ids = getSelectedIds();
      if (ids.length === 0) return;

      const routes = [];
      ids.forEach(id => {
        const tr = document.querySelector(`tr[data-id="${id}"]`);
        if (tr) routes.push(tr.dataset.route);
      });
      const previewRoutes = routes.slice(0, 5).map(r => `• ${r}`).join('\n');
      const moreText = routes.length > 5 ? `\n• ... och ${routes.length - 5} till` : '';

      if (!confirm(`Radera ${ids.length} ${ids.length === 1 ? 'bokning' : 'bokningar'}?\n\n${previewRoutes}${moreText}\n\nRelaterade bud, meddelanden och notifikationer tas också bort.\nKan inte ångras.`)) return;

      deleteBtn.disabled = true;
      deleteBtn.textContent = '⏳ Raderar...';

      try {
        // BULK: ett SQL-anrop tar bort alla på en gång. CASCADE rensar bids/msgs/notifs.
        const { error } = await sb.from('bookings').delete().in('id', ids);
        if (error) throw error;
        toast(`✅ ${ids.length} ${ids.length === 1 ? 'bokning' : 'bokningar'} raderade`);
        // Ta bort raderna från DOM direkt
        ids.forEach(id => {
          const tr = document.querySelector(`tr[data-id="${id}"]`);
          if (tr) tr.remove();
        });
        bar.style.display = 'none';
        // Bygg om sidan om alla rader togs bort (visa "Inga öppna körningar")
        if (document.querySelectorAll('.booking-select').length === 0) navigate('/available');
      } catch (err) {
        console.error('Bulk-delete fel:', err);
        toast('Kunde inte radera: ' + (err.message || err), 'err');
        deleteBtn.disabled = false;
        deleteBtn.textContent = '🗑 Radera valda';
      }
    });

    // "Rensa ALLA tillgängliga"-knapp — rensar även importhistorik
    // så att auto-import kan köras om från noll
    document.getElementById('clearAllOpenBtn')?.addEventListener('click', async () => {
      const total = document.querySelectorAll('tr[data-id]').length;
      if (total === 0) return;
      if (!confirm(`⚠️ Radera ALLA ${total} tillgängliga körningar?\n\nDetta:\n• Tar bort alla körningar + bud/meddelanden/notifikationer\n• Nollställer importhistoriken så auto-import kan köras om från noll\n• Speditörer (magic-links) behålls\n\nKan inte ångras.`)) return;
      if (!confirm(`Är du HELT säker? Detta är slutgiltigt.`)) return;

      const clearBtn = document.getElementById('clearAllOpenBtn');
      clearBtn.disabled = true;
      clearBtn.textContent = '⏳ Rensar...';
      try {
        // 1. Radera alla öppna bokningar (CASCADE tar hand om bids/msgs/notifs)
        const { error: bErr } = await sb.from('bookings').delete().eq('status', 'open');
        if (bErr) throw bErr;
        // 2. Rensa importhistorik så samma mejl kan importeras om
        const { error: eErr } = await sb.from('email_imports').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        if (eErr) console.warn('email_imports rensa-fel:', eErr);
        // 3. Nollställ counters i speditor_invitations
        const { error: iErr } = await sb.from('speditor_invitations').update({ bookings_imported_count: 0 }).neq('id', '00000000-0000-0000-0000-000000000000');
        if (iErr) console.warn('invitations counter-fel:', iErr);

        toast(`✅ ${total} körningar + importhistorik rensade`);
        navigate('/available');
      } catch (err) {
        console.error('Rensa-alla fel:', err);
        toast('Kunde inte rensa: ' + (err.message || err), 'err');
        clearBtn.disabled = false;
        clearBtn.textContent = '🧹 Rensa alla tillgängliga';
      }
    });
  }
});

route(/^\/free-vehicles$/, async (_m, u) => {
  if (!u || u.role === 'chauffor') return navigate('/');
  const all = await db.all('freeVehicles');
  const active = all.filter(x => x.status !== 'archived');
  active.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const users = {};
  const vehiclesById = {};
  for (const fv of active) {
    if (!users[fv.haulerId]) users[fv.haulerId] = await db.get('users', fv.haulerId);
    if (fv.vehicleId && !vehiclesById[fv.vehicleId]) vehiclesById[fv.vehicleId] = await db.get('vehicles', fv.vehicleId);
  }
  mount(`
    <h2>🚚 Lediga bilar (${active.length})</h2>
    <div class="btn-row">
      ${canAcceptAndPost(u) ? `<a class="btn" href="#/free-vehicles/new">➕ Lägg till ledig bil</a>` : ''}
    </div>
    <div class="banner info">Här ser du tillgängliga fordon som söker last. Kontakta åkaren för att matcha med en körning.</div>
    <div class="card">
      ${active.length === 0 ? `<div class="empty">Inga lediga bilar just nu.</div>`
      : `<table class="compact">
          <thead><tr><th>Rutt</th><th>Fordon</th><th>Egenskaper</th><th>Tillgänglig</th><th>Åkare</th><th>Kommentar</th><th></th></tr></thead>
          <tbody>
          ${active.map(fv => {
            const owner = users[fv.haulerId];
            const isMine = u.id === fv.haulerId;
            const dest = fv.anywhere ? '<span class="badge feature">Vart som helst</span>' : `<b>${esc(fv.destination || '—')}</b>`;
            const linkedVeh = fv.vehicleId ? vehiclesById[fv.vehicleId] : null;
            const flm = (fv.freeFlm != null && fv.freeFlm !== '') ? `${esc(fv.freeFlm)} FLM` : '';
            const vehTop = linkedVeh ? `<b>${esc(linkedVeh.regNr || '')}</b>` : '<span class="muted">—</span>';
            const vehSub = [linkedVeh?.model, flm].filter(Boolean).map(esc).join(' · ');
            const features = [
              fv.adr ? '<span class="badge feature">ADR</span>' : '',
              fv.tailLift ? '<span class="badge feature">Lift</span>' : '',
              fv.openSide ? '<span class="badge feature">Öpp.sida</span>' : '',
              fv.reefer ? '<span class="badge feature">Kyl/Frys</span>' : '',
            ].filter(Boolean).join('');
            const avail = [fv.availableFrom, fv.availableTime].filter(Boolean).join(' ') || '—';
            return `<tr>
              <td><b>${esc(fv.currentLocation || '—')}</b> → ${dest}</td>
              <td>${vehTop}${vehSub ? '<br><span class="muted" style="font-size:11px">' + vehSub + '</span>' : ''}</td>
              <td>${features || '<span class="muted">—</span>'}</td>
              <td class="nowrap">${esc(avail)}</td>
              <td>${owner ? esc(owner.company || owner.name) : '—'}<br><span class="muted" style="font-size:11px">${owner ? esc(owner.phone || owner.email) : ''}</span></td>
              <td style="font-size:12px">${esc(fv.comment || '')}</td>
              <td class="nowrap">${isMine || u.role === 'admin'
                ? `<a class="btn secondary icon-btn" href="#/free-vehicles/${fv.id}/edit" title="Ändra">✏️</a>
                   <button class="danger icon-btn" data-delfv="${fv.id}" title="Ta bort">🗑</button>`

        </table>`}

function bindFreeVehicleForm(u, fv) {
  const anyCb = document.querySelector('input[name="anywhere"]');
  const destField = document.getElementById('destField');
  const updateDest = () => { destField.style.display = anyCb.checked ? 'none' : ''; };
  anyCb.onchange = updateDest; updateDest();
  document.getElementById('fvForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const anywhere = !!f.get('anywhere');

    if (!anywhere && !destination) { toast('Ange destination eller kryssa "Kan åka vart som helst"', 'err'); return; }
    const data = {
      haulerId: fv ? fv.haulerId : u.id,
      currentLocation: (f.get('currentLocation') || '').trim(),
      availableFrom: f.get('availableFrom') || '',
      availableTime: f.get('availableTime') || '',
      anywhere,
      destination: anywhere ? '' : destination,
      vehicleId: f.get('vehicleId') ? Number(f.get('vehicleId')) : null,
      freeFlm: f.get('freeFlm') ? Number(f.get('freeFlm')) : null,
      adr: !!f.get('adr'),
      tailLift: !!f.get('tailLift'),
      openSide: !!f.get('openSide'),
      reefer: !!f.get('reefer'),
      comment: (f.get('comment') || '').trim(),
      status: 'available',
      createdAt: fv ? fv.createdAt : Date.now(),
      updatedAt: Date.now(),
    };
    if (fv) { data.id = fv.id; await db.put('freeVehicles', data); toast('Sparad'); }
    else { await db.add('freeVehicles', data); toast('Publicerad'); }
    navigate('/free-vehicles');
  };
}

route(/^\/drivers\/new$/, async (_m, u) => {
  if (!isHauler(u)) return navigate('/');
  mount(`<h2>Ny chaufför</h2>${await driverForm(null, u)}`);
  document.getElementById('drvForm').onsubmit = async e => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Skapar chaufför + skickar inbjudan...';
    try {
      const f = new FormData(e.target);
      const email = (f.get('email') || '').toLowerCase().trim();
      const name = (f.get('name') || '').trim();
      if (!email || !name) throw new Error('Namn och e-post krävs');

      // Kontrollera om driver med samma email finns redan
      const existing = await sb.from('drivers').select('id').eq('hauler_id', u.id).eq('email', email).maybeSingle();
      if (existing.data) throw new Error('Chaufför med denna e-post finns redan i din flotta');

      // Skapa driver-rad (utan lösenord — chauffören sätter sitt eget via magic-link)
      const { data: newDriver, error: createErr } = await sb.from('drivers').insert({
        hauler_id: u.id,
        name,
        email,
        phone: (f.get('phone') || '').trim() || null,
        vehicle_id: f.get('vehicleId') || null,
        active: f.get('active') === '1',
      }).select().single();
      if (createErr) throw createErr;

      // Skicka inbjudningsmejl via Edge Function
      const session = await sb.auth.getSession();
      const accessToken = session?.data?.session?.access_token;
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/send-driver-invite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
        body: JSON.stringify({ driver_id: newDriver.id }),
      });
      const respData = await resp.json();
      if (!resp.ok) {
        console.error('Inbjudan-fel:', respData);
        toast(`Chaufför tillagd men mejlet kunde inte skickas: ${respData.error || 'okänt fel'}`, 'warn');
      } else {
        toast(`✅ Chaufför tillagd — inbjudan skickad till ${email}`);
      }
      navigate('/drivers');
    } catch (err) {
      console.error('Lägg till chaufför fel:', err);
      toast('Kunde inte lägga till: ' + (err.message || err), 'err');
      submitBtn.disabled = false;
      submitBtn.textContent = '📧 Lägg till + skicka inbjudan';
    }
  };
});

route(/^\/accept-driver\/([a-f0-9]+)$/, async (m) => {
  const token = m[1];
  document.getElementById('app').innerHTML = '<div class="auth-wrap"><div class="card"><div style="text-align:center;padding:40px;color:#6b7280">⏳ Verifierar inbjudan...</div></div></div>';
  try {
    // Använd SECURITY DEFINER-funktion (fungerar för oinloggade)
    const { data: rows, error } = await sb.rpc('get_driver_by_magic_token', { token });
    const driver = Array.isArray(rows) ? rows[0] : rows;
    if (error || !driver) {
      console.error('get_driver_by_magic_token fel:', error);
      document.getElementById('app').innerHTML = `<div class="auth-wrap"><div class="card">
        <h2>Länken är ogiltig</h2>
        <p>Inbjudningslänken kunde inte hittas eller har redan använts. Be åkeriet skicka en ny.</p>
        <a class="btn" href="#/">Till startsidan</a>
      </div></div>`;
      return;
    }
    if (driver.accepted_at) {
      document.getElementById('app').innerHTML = `<div class="auth-wrap"><div class="card">
        <h2>Inbjudan redan accepterad</h2>
        <p>Det verkar som du redan skapat ditt konto via denna länk.</p>
        <a class="btn" href="#/login">Logga in</a>
      </div></div>`;
      return;
    }

    // Visa signup-formulär med email förfyllt och låst
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap">
        <div class="card">
          <div style="text-align:center;margin-bottom:16px"><img src="/logo.png" alt="hittalast.se" style="max-width:200px;width:80%;height:auto"></div>
          <h2 style="margin-top:0">🚛 Välkommen som chaufför!</h2>
          <p class="muted" style="margin-top:-8px">Hej <b>${esc(driver.name)}</b>! Du har bjudits in som chaufför. Välj ett lösenord nedan så är du klar.</p>
          <div class="banner ok" style="margin-bottom:14px">✅ Inbjudningslänk verifierad</div>
          <form id="acceptDriverForm">
            <div class="field"><label>Namn</label><input name="name" value="${esc(driver.name || '')}" required></div>
            <div class="field"><label>Telefon</label><input name="phone" value="${esc(driver.phone || '')}"></div>
            <div class="field"><label>E-post</label><input name="email" type="email" value="${esc(driver.email)}" readonly style="background:#f5f5f5;cursor:not-allowed"></div>
            <div class="field"><label>Välj lösenord *</label><input name="pwd" type="password" required minlength="6" autocomplete="new-password" placeholder="Minst 6 tecken"></div>
            <button type="submit" style="width:100%;background:#f97316;color:#fff;font-weight:700;padding:14px;border:none;border-radius:8px;cursor:pointer;font-size:15px">🚛 Skapa konto + börja köra</button>
          </form>
        </div>
      </div>`;

    document.getElementById('acceptDriverForm').onsubmit = async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = '⏳ Skapar konto...';
      try {
        const f = new FormData(e.target);
        // Anropa Edge Function som skapar user med email_confirm=true (slipper bekräftelsemejl)
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/accept-driver-signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            password: f.get('pwd'),
            name: (f.get('name') || '').trim(),
            phone: (f.get('phone') || '').trim(),
          }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Misslyckades');

        // Logga in direkt
        btn.textContent = '⏳ Loggar in...';
        await login(driver.email, f.get('pwd'));
        toast('🎉 Välkommen till hittalast.se!');
        navigate('/');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '🚛 Skapa konto + börja köra';
        toast(err.message || 'Något gick fel', 'err');
      }
    };
  } catch (err) {
    console.error('Accept driver-fel:', err);
    toast('Kunde inte verifiera länken: ' + (err.message || err), 'err');
    navigate('/');
  }
});

// --------- Admin: Importera mejl manuellt ---------
route(/^\/import-email$/, async (_m, u) => {
  if (!u || u.role !== 'admin') return navigate('/');

  mount(`
    <div class="card" style="background:linear-gradient(135deg,#0a0a0a,#1f1f1f);color:#fff;border:1px solid var(--brand);margin-bottom:18px">
      <h2 style="margin-top:0;color:#f97316">⚡ Auto-importera från Outlook</h2>
      <p style="font-size:14px;color:#d4d4d8;margin-bottom:14px">Tryck en knapp och importera alla mejl från Hitta last-mappen i info@ostgotatransport.se.</p>
      <div class="btn-row">
        <button id="autoImportBtn" style="background:#f97316;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:700;cursor:pointer">🚀 Auto-importera från Outlook (Hitta last)</button>
        <button id="bulkPasteBtn" class="secondary" style="background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.15);padding:12px 24px;border-radius:8px;cursor:pointer">📋 Klistra in flera mejl samtidigt</button>
      </div>
      <div id="autoImportInfo" style="display:none;margin-top:16px;padding:16px;background:rgba(255,255,255,0.04);border-radius:8px;border:1px solid rgba(255,255,255,0.08)"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">✉️ Importera ett enskilt mejl</h2>
      <p class="muted" style="font-size:14px">Klistra in ett mejl från en speditör. Systemet identifierar uppdrag, anonymiserar avsändaren och skapar bokningar.</p>

      <form id="importForm">
        <div class="row">
          <div class="field"><label>Avsändar-email *</label><input name="sender_email" type="email" required placeholder="pontus.inerud@dsv.com"></div>
          <div class="field"><label>Avsändarens namn</label><input name="sender_name" placeholder="Pontus Inerud"></div>
        </div>
        <div class="row">
          <div class="field"><label>Företag</label><input name="sender_company" placeholder="DSV Road AB"></div>
          <div class="field"><label>Ämne</label><input name="subject" placeholder="Gods över fredag"></div>
        </div>
        <div class="field">
          <label>Mejl-innehåll * (klistra in hela texten)</label>
          <textarea name="raw_body" required rows="14" placeholder="1. COLLECT FROM:..."  style="font-family:ui-monospace,monospace;font-size:13px"></textarea>
        </div>
        <div class="check" style="margin:8px 0">
          <input type="checkbox" name="use_llm" id="useLlm" checked>
          <label for="useLlm" style="margin:0">Använd Claude AI som fallback om regex misslyckas <span class="muted">(kräver ANTHROPIC_API_KEY i Vault)</span></label>
        </div>
        <div class="btn-row" style="margin-top:14px">
          <button type="button" id="dryRunBtn" class="secondary">🔍 Förhandsgranska (utan att spara)</button>
          <button type="submit">📥 Importera & skapa bokningar</button>
          <a class="btn secondary" href="#/">Avbryt</a>
        </div>
      </form>

      <div id="importResult" style="margin-top:20px"></div>
    </div>
  `);

  async function callParseEmail(dry_run) {
    const f = new FormData(document.getElementById('importForm'));
    const payload = {
      sender_email: f.get('sender_email')?.trim(),
      sender_name: f.get('sender_name')?.trim() || null,
      sender_company: f.get('sender_company')?.trim() || null,
      subject: f.get('subject')?.trim() || null,
      raw_body: f.get('raw_body'),
      use_llm_fallback: !!f.get('use_llm'),
      dry_run,
    };
    if (!payload.sender_email || !payload.raw_body) {
      toast('Avsändar-email och mejl-innehåll krävs', 'err');
      return;
    }

    const resultEl = document.getElementById('importResult');
    resultEl.innerHTML = '<div class="muted">⏳ Bearbetar…</div>';

    const session = await sb.auth.getSession();
    const accessToken = session?.data?.session?.access_token;

    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/parse-email`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();

      if (!resp.ok || data.error) {
        resultEl.innerHTML = `<div class="callout" style="border-left:4px solid var(--danger);padding:14px;background:rgba(180,35,24,0.06)">
          <strong>Fel:</strong> ${esc(data.error || 'Okänt fel')}
          ${data.details ? `<pre style="margin-top:6px;font-size:11px;white-space:pre-wrap">${esc(data.details)}</pre>` : ''}
        </div>`;
        return;
      }

      if (data.success === false) {
        resultEl.innerHTML = `<div class="callout" style="border-left:4px solid var(--warn);padding:14px;background:rgba(180,93,9,0.06)">
          <strong>⚠️ ${esc(data.message || 'Inga uppdrag hittades')}</strong>
          <div class="muted" style="font-size:13px;margin-top:6px">Format: ${esc(data.format_detected || '—')}, LLM-försökt: ${data.llm_attempted ? 'ja' : 'nej'}</div>
        </div>`;
        return;
      }

      if (data.dry_run) {
        resultEl.innerHTML = `
          <div class="callout" style="border-left:4px solid var(--info);padding:14px;background:rgba(56,189,248,0.06);margin-bottom:14px">
            <strong>🔍 Förhandsgranskning (inget sparat)</strong>
            <div class="muted" style="font-size:13px;margin-top:6px">
              Format: <code>${esc(data.format_detected)}</code> · LLM: ${data.llm_used ? '✓' : '—'} · Hittade ${data.orders_found} uppdrag
            </div>
          </div>
          <div class="card" style="background:var(--bg-2)"><h4 style="margin-top:0">Uppdrag som skulle skapas:</h4>
            ${data.orders.map((o, i) => `
              <div style="padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px">
                <strong>${i + 1}. ${esc(o.from_location)} → ${esc(o.to_location)}</strong>
                <div class="muted" style="font-size:13px;margin-top:4px">
                  ${o.flm ? `${o.flm} FLM · ` : ''}${o.weight ? `${o.weight.toLocaleString('sv-SE')} kg · ` : ''}${o.load_date ? `Lasta ${o.load_date} · ` : ''}${o.unload_date ? `Lossa ${o.unload_date} · ` : ''}${o.adr ? '⚠️ ADR · ' : ''}${o.price ? `${o.price.toLocaleString('sv-SE')} kr` : ''}
                </div>
                ${o.description ? `<div style="font-size:12px;margin-top:6px;color:var(--muted)">${esc(o.description)}</div>` : ''}
              </div>
            `).join('')}
          </div>`;
      } else {
        resultEl.innerHTML = `
          <div class="callout" style="border-left:4px solid var(--ok);padding:14px;background:rgba(20,122,61,0.08)">
            <strong>✅ Klart!</strong>
            <div style="margin-top:8px">
              ${data.total_inserted} bokningar skapade · ${data.total_skipped} hoppade över (duplicat eller fel)
            </div>
            <div class="muted" style="font-size:13px;margin-top:6px">
              Format: ${esc(data.format_detected)} · LLM-använd: ${data.llm_used ? 'ja' : 'nej'}
            </div>
          </div>
          ${data.inserted.length ? `
            <div class="card" style="margin-top:14px;background:var(--bg-2)">
              <h4 style="margin-top:0">Skapade bokningar (${data.inserted.length})</h4>
              <ul style="margin:0;padding-left:20px">
                ${data.inserted.map(b => `<li>${esc(b.from_location)} → ${esc(b.to_location)}${b.flm ? ` (${b.flm} FLM)` : ''}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
          ${data.skipped.length ? `
            <div class="card" style="margin-top:14px;background:var(--bg-2)">
              <h4 style="margin-top:0;color:var(--warn)">Hoppade över (${data.skipped.length})</h4>
              <ul style="margin:0;padding-left:20px;font-size:13px">
                ${data.skipped.map(s => `<li>${esc(s.rutt)} — <span class="muted">${esc(s.reason)}</span></li>`).join('')}
              </ul>
            </div>
          ` : ''}
          <div style="margin-top:14px"><a class="btn" href="#/available">Se alla bokningar →</a></div>`;
      }
    } catch (e) {
      console.error('Import error:', e);
      resultEl.innerHTML = `<div class="callout" style="border-left:4px solid var(--danger);padding:14px;background:rgba(180,35,24,0.06)"><strong>Tekniskt fel:</strong> ${esc(e.message || e)}</div>`;
    }
  }

  document.getElementById('dryRunBtn').onclick = () => callParseEmail(true);
  document.getElementById('importForm').onsubmit = e => { e.preventDefault(); callParseEmail(false); };

  // Auto-importera-knapp → anropar import-outlook-folder Edge Function
  async function runOutlookImport(dryRun) {
    const info = document.getElementById('autoImportInfo');
    info.style.display = 'block';
    info.innerHTML = `<div style="color:#d4d4d8">⏳ ${dryRun ? 'Förhandsgranskar' : 'Importerar'} mejl från Outlook-mappen "Hitta last"… <span class="muted" style="font-size:12px">(kan ta 20-60s)</span></div>`;

    // Hämta valfri "antal dagar tillbaka"
    const daysBackInput = document.getElementById('autoImportDaysBack');
    const daysBack = daysBackInput && daysBackInput.value ? parseInt(daysBackInput.value, 10) : null;
    const maxEmailsInput = document.getElementById('autoImportMaxEmails');
    const maxEmails = maxEmailsInput && maxEmailsInput.value ? parseInt(maxEmailsInput.value, 10) : 50;

    try {
      const session = await sb.auth.getSession();
      const accessToken = session?.data?.session?.access_token;
      if (!accessToken) {
        info.innerHTML = `<div style="color:#fca5a5">❌ Du måste vara inloggad som admin.</div>`;
        return;
      }
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/import-outlook-folder`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`,
        },
        body: JSON.stringify({
          user_email: 'info@ostgotatransport.se',
          folder_name: 'Hitta last',
          max_emails: maxEmails,
          days_back: daysBack,
          dry_run: dryRun,
        }),
      });
      const data = await resp.json();

      if (!resp.ok || data.error) {
        info.innerHTML = `
          <div style="background:rgba(180,35,24,0.15);padding:14px;border-radius:8px;border-left:3px solid #ef4444">
            <strong style="color:#fca5a5">❌ Fel:</strong> <span style="color:#fca5a5">${esc(data.error || 'Okänt fel')}</span>
            ${data.details ? `<pre style="margin-top:8px;font-size:11px;white-space:pre-wrap;color:#e5e5e5;background:rgba(0,0,0,0.3);padding:8px;border-radius:4px">${esc(data.details)}</pre>` : ''}
          </div>`;
        return;
      }

      if (data.dry_run) {
        info.innerHTML = `
          <div style="background:rgba(56,189,248,0.1);padding:14px;border-radius:8px;border-left:3px solid #38bdf8;margin-bottom:12px">
            <strong style="color:#7dd3fc">🔍 Förhandsgranskning</strong>
            <div style="margin-top:8px;color:#d4d4d8;font-size:14px;line-height:1.8">
              📬 Totalt i mappen: <strong>${data.total_mails}</strong> mejl<br>
              ✅ Redan importerade: <strong>${data.already_imported}</strong><br>
              📥 Skulle importeras: <strong>${data.to_import}</strong>
            </div>
          </div>
          ${data.sample && data.sample.length ? `
            <div style="background:rgba(255,255,255,0.04);padding:12px;border-radius:8px">
              <strong style="color:#facc15;font-size:13px">Förhandsvisning (3 första):</strong>
              <ul style="margin:6px 0 0;padding-left:20px;color:#d4d4d8;font-size:13px">
                ${data.sample.map(s => `<li><strong>${esc(s.subject || '(inget ämne)')}</strong> — ${esc(s.from || '?')} <span class="muted">${esc((s.received || '').slice(0, 10))}</span></li>`).join('')}
              </ul>
            </div>` : ''}
          <div style="margin-top:12px">
            <button id="runRealImportBtn" style="background:#f97316;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer">📥 Kör skarpt nu (${data.to_import} mejl)</button>
          </div>`;
        const realBtn = document.getElementById('runRealImportBtn');
        if (realBtn) realBtn.onclick = () => runOutlookImport(false);
        return;
      }

      // Skarp körning — visa resultat
      info.innerHTML = `
        <div style="background:rgba(20,122,61,0.15);padding:14px;border-radius:8px;border-left:3px solid #22c55e">
          <strong style="color:#86efac">✅ Klart!</strong>
          <div style="margin-top:8px;color:#d4d4d8;font-size:14px;line-height:1.8">
            📬 Totalt i mappen: <strong>${data.total_mails}</strong><br>
            ⏭️ Redan importerade förut: <strong>${data.already_imported}</strong><br>
            🔄 Bearbetade nu: <strong>${data.processed}</strong><br>
            ✅ Lyckade mejl: <strong>${data.success_count}</strong><br>
            ❌ Misslyckade: <strong>${data.fail_count}</strong><br>
            🚛 Nya bokningar skapade: <strong style="color:#86efac;font-size:18px">${data.total_bookings_created}</strong>
          </div>
        </div>
        ${data.results && data.results.length ? `
          <details style="margin-top:12px;background:rgba(255,255,255,0.04);padding:12px;border-radius:8px">
            <summary style="cursor:pointer;color:#facc15;font-weight:600">Detaljer per mejl (${data.results.length})</summary>
            <ul style="margin:10px 0 0;padding-left:20px;color:#d4d4d8;font-size:13px;line-height:1.6">
              ${data.results.map(r => `
                <li>
                  ${r.status === 'ok' ? '✅' : '❌'} <strong>${esc(r.subject || '(inget ämne)')}</strong>
                  ${r.status === 'ok' ? `— ${r.inserted || 0} bokningar (${r.skipped || 0} hoppade)` : `— <span style="color:#fca5a5">${esc(r.error || '')}</span>`}
                </li>`).join('')}
            </ul>
          </details>` : ''}
        <div style="margin-top:14px"><a class="btn" href="#/available" style="background:#f97316;color:#fff">Se alla bokningar →</a></div>`;
    } catch (e) {
      console.error('Outlook import error:', e);
      info.innerHTML = `<div style="background:rgba(180,35,24,0.15);padding:14px;border-radius:8px;border-left:3px solid #ef4444"><strong style="color:#fca5a5">Tekniskt fel:</strong> <span style="color:#fca5a5">${esc(e.message || e)}</span></div>`;
    }
  }

  document.getElementById('autoImportBtn').onclick = () => {
    const info = document.getElementById('autoImportInfo');
    // Toggle: stäng om redan öppen
    if (info.style.display === 'block' && info.dataset.mode === 'options') {
      info.style.display = 'none';
      info.dataset.mode = '';
      return;
    }
    info.style.display = 'block';
    info.dataset.mode = 'options';
    info.innerHTML = `
      <h3 style="margin-top:0;color:#f97316;font-size:18px">📦 Auto-import från info@ostgotatransport.se → Hitta last-mappen</h3>
      <p style="color:#d4d4d8;font-size:14px;margin:0 0 14px">Systemet loggar in på Outlook via Microsoft Graph och hämtar mejl. Mejl som redan importerats hoppas över.</p>

      <div style="display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap">
        <div>
          <label style="display:block;font-size:12px;color:#a0a0a0;margin-bottom:4px">Antal mejl (max 200)</label>
          <input id="autoImportMaxEmails" type="number" min="1" max="200" value="200" style="width:120px;padding:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:6px">
        </div>
        <div>
          <label style="display:block;font-size:12px;color:#a0a0a0;margin-bottom:4px">Endast senaste X dagar (tomt = alla)</label>
          <input id="autoImportDaysBack" type="number" min="1" max="365" placeholder="tomt = alla" style="width:140px;padding:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:6px">
        </div>
      </div>

      <div class="btn-row">
        <button id="autoImportDryBtn" class="secondary" style="background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:10px 18px;border-radius:8px;cursor:pointer">🔍 Förhandsgranska först</button>
        <button id="autoImportRunBtn" style="background:#f97316;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer">📥 Importera direkt</button>
      </div>
      <div id="autoImportResult" style="margin-top:14px"></div>
    `;
    document.getElementById('autoImportDryBtn').onclick = () => runOutlookImport(true);
    document.getElementById('autoImportRunBtn').onclick = () => runOutlookImport(false);
  };

  // Bulk-paste: klistra in flera mejl samtidigt
  document.getElementById('bulkPasteBtn').onclick = () => {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto';
    modal.innerHTML = `
      <div style="background:var(--card);max-width:800px;width:100%;border-radius:14px;padding:32px;color:var(--ink)">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px">
          <h2 style="margin:0">📋 Klistra in flera mejl samtidigt</h2>
          <button id="closeBulk" style="background:none;border:none;font-size:28px;cursor:pointer;color:var(--muted);line-height:1">×</button>
        </div>
        <p class="muted" style="font-size:14px;margin-bottom:14px">Klistra in flera mejl separerade med en rad som innehåller bara <code>---</code>. Systemet splittrar och importerar varje mejl separat.</p>
        <div class="callout info" style="margin-bottom:14px">
          <strong>Format-tips:</strong> Lägg en rad med <code>FROM: avsändare@ex.se</code> överst i varje mejl. Systemet plockar avsändaren därifrån.
        </div>
        <textarea id="bulkBody" rows="20" placeholder="FROM: pontus.inerud@dsv.com&#10;NAME: Pontus Inerud&#10;COMPANY: DSV Road AB&#10;SUBJECT: Gods över fredag&#10;&#10;1. COLLECT FROM:...&#10;(mejl 1 innehåll)&#10;&#10;---&#10;&#10;FROM: martin.adam@dsv.com&#10;NAME: Martin Adam&#10;COMPANY: DSV Road AB&#10;SUBJECT: GODS LASTNING IDAG&#10;&#10;1. COLLECT FROM:...&#10;(mejl 2 innehåll)" style="width:100%;font-family:ui-monospace,monospace;font-size:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></textarea>
        <div class="btn-row" style="margin-top:14px">
          <button id="bulkSubmitBtn">📥 Importera alla mejl</button>
          <button id="closeBulkBottom" class="secondary">Avbryt</button>
        </div>
        <div id="bulkResult" style="margin-top:14px"></div>
      </div>
    `;
    document.body.appendChild(modal);
    const close = () => modal.remove();
    document.getElementById('closeBulk').onclick = close;
    document.getElementById('closeBulkBottom').onclick = close;
    modal.onclick = e => { if (e.target === modal) close(); };

    document.getElementById('bulkSubmitBtn').onclick = async () => {
      const text = document.getElementById('bulkBody').value.trim();
      if (!text) { toast('Klistra in minst ett mejl', 'err'); return; }

      // Splittra på "---" på egen rad
      const emailTexts = text.split(/\n\s*---\s*\n/).map(t => t.trim()).filter(Boolean);
      if (emailTexts.length === 0) { toast('Hittade inga mejl', 'err'); return; }

      const result = document.getElementById('bulkResult');
      result.innerHTML = `<div class="muted">⏳ Importerar ${emailTexts.length} mejl…</div>`;

      const session = await sb.auth.getSession();
      const accessToken = session?.data?.session?.access_token;

      let totalInserted = 0, totalSkipped = 0, totalFailed = 0;
      const details = [];

      for (let i = 0; i < emailTexts.length; i++) {
        const raw = emailTexts[i];
        // Plocka FROM/NAME/COMPANY/SUBJECT från headers om de finns
        const fromMatch = raw.match(/^FROM:\s*(.+)$/im);
        const nameMatch = raw.match(/^NAME:\s*(.+)$/im);
        const companyMatch = raw.match(/^COMPANY:\s*(.+)$/im);
        const subjectMatch = raw.match(/^SUBJECT:\s*(.+)$/im);

        if (!fromMatch) {
          details.push({ index: i + 1, status: 'skipped', reason: 'Saknar FROM-header' });
          totalFailed++;
          continue;
        }

        // Rensa headers från body
        const body = raw
          .replace(/^FROM:.*$/im, '')
          .replace(/^NAME:.*$/im, '')
          .replace(/^COMPANY:.*$/im, '')
          .replace(/^SUBJECT:.*$/im, '')
          .trim();

        try {
          const resp = await fetch(`${SUPABASE_URL}/functions/v1/parse-email`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}` },
            body: JSON.stringify({
              sender_email: fromMatch[1].trim(),
              sender_name: nameMatch?.[1]?.trim() || null,
              sender_company: companyMatch?.[1]?.trim() || null,
              subject: subjectMatch?.[1]?.trim() || null,
              raw_body: body,
              use_llm_fallback: true,
            }),
          });
          const data = await resp.json();
          if (data.success) {
            totalInserted += data.total_inserted || 0;
            totalSkipped += data.total_skipped || 0;
            details.push({ index: i + 1, status: 'ok', from: fromMatch[1].trim(), inserted: data.total_inserted, skipped: data.total_skipped });
          } else {
            totalFailed++;
            details.push({ index: i + 1, status: 'failed', from: fromMatch[1].trim(), reason: data.message || data.error });
          }
        } catch (err) {
          totalFailed++;
          details.push({ index: i + 1, status: 'error', from: fromMatch[1].trim(), reason: err.message });
        }
      }

      result.innerHTML = `
        <div class="callout" style="border-left:4px solid var(--ok);padding:14px;background:rgba(20,122,61,0.08)">
          <strong>✅ Klart!</strong><br>
          ${totalInserted} bokningar skapade · ${totalSkipped} duplicat hoppade över · ${totalFailed} mejl misslyckades
        </div>
        <div style="margin-top:12px;max-height:300px;overflow:auto;background:var(--bg-2);padding:12px;border-radius:8px;font-size:13px">
          ${details.map(d => `<div style="padding:6px 0;border-bottom:1px dashed var(--line)">
            <strong>Mejl ${d.index}</strong> (${esc(d.from || '?')}):
            ${d.status === 'ok' ? `<span style="color:var(--ok)">✓ ${d.inserted} skapade, ${d.skipped} duplicat</span>` : `<span style="color:var(--danger)">✗ ${esc(d.reason || 'Misslyckades')}</span>`}
          </div>`).join('')}
        </div>
      `;
    };
  };
});

function bindUserForm(target) {
  const isNew = !target;
  document.getElementById('userForm').onsubmit = async e => {
    e.preventDefault();
    try {
      const f = new FormData(e.target);
      const email = (f.get('email') || '').toLowerCase().trim();
      if (!email) { toast('E-post krävs', 'err'); return; }

      // Bygg profilen-data (email lagras i auth.users, INTE i profiles-tabellen)
      const data = target ? { ...target } : { createdAt: Date.now() };
      data.name = (f.get('name') || '').trim();
      data.role = f.get('role');
      data.phone = (f.get('phone') || '').trim();
      data.company = (f.get('company') || '').trim();
      data.orgNr = (f.get('orgNr') || '').trim();
      data.address = (f.get('address') || '').trim();
      data.contactPerson = (f.get('contactPerson') || '').trim();
      data.subscriptionActive = !!f.get('subscriptionActive');

      const customPrice = f.get('manualMonthlyFee');
      data.manualMonthlyFee = (customPrice && Number(customPrice) > 0) ? Number(customPrice) : null;

      // Trial end: räkna tillbaka till createdAt så befintliga helpers fungerar
      const trialEndDate = f.get('trialEndDate');
      if (trialEndDate) {
        data.createdAt = new Date(trialEndDate).getTime() - TRIAL_DAYS * 86400000;
      }

      const pwd = f.get('pwd');

      if (isNew) {
        if (!pwd) { toast('Lösenord krävs för ny användare', 'err'); return; }

        // Spara admin-sessionen innan signUp (annars byts vår session ut)
        const { data: { session: adminSession } } = await sb.auth.getSession();

        const { data: signupResult, error: signupError } = await sb.auth.signUp({
          email,
          password: pwd,
          options: { data: { name: data.name, role: data.role } }
        });
        if (signupError) {
          if (/already|registered|exists/i.test(signupError.message)) {
            toast('E-postadressen är redan registrerad', 'err');
          } else {
            toast('Fel: ' + signupError.message, 'err');
          }
          // Återställ admin-session om den bytts ut trots felet
          if (adminSession) {
            await sb.auth.setSession({ access_token: adminSession.access_token, refresh_token: adminSession.refresh_token });
            await refreshSession();
          }
          return;
        }
        // Vänta så triggern hinner skapa profil-raden
        await new Promise(r => setTimeout(r, 800));

        if (signupResult.user) {
          // Uppdatera profil-raden med all extra data (utan email — den ligger i auth)
          const profileUpdate = {
            role: data.role,
            name: data.name,
            phone: data.phone,
            company: data.company,
            org_nr: data.orgNr,
            address: data.address,
            contact_person: data.contactPerson,
            subscription_active: data.subscriptionActive,
            manual_monthly_fee: data.manualMonthlyFee,
            created_at: new Date(data.createdAt).toISOString(),
          };
          const { error: updateError } = await sb.from('profiles').update(profileUpdate).eq('id', signupResult.user.id);
          if (updateError) console.error('Profil-update efter signUp', updateError);
        }

        // Återställ admin-sessionen (signUp byter ut den)
        if (adminSession) {
          await sb.auth.setSession({ access_token: adminSession.access_token, refresh_token: adminSession.refresh_token });
          await refreshSession();
        }

        toast(`Användare ${data.name} skapad`);
      } else {
        // Edit: bara profil-uppdatering. Email kan inte ändras härifrån (kräver auth-flöde).
        await db.put('users', data);
        if (pwd) {
          // Lösenordsbyte kräver admin-API som inte är tillgängligt klient-sida — skippas
          toast('Användare uppdaterad. OBS: lösenordsbyte kräver Supabase admin-API och är inte tillgängligt här.', 'warn');
        } else {
          toast('Ändringar sparade');
        }
      }
      navigate('/users');
    } catch (err) {
      console.error('Spara användare-fel:', err);
      toast('Fel: ' + (err.message || err), 'err');
    }
  };
}

// --------- Statistik (åkare) ---------
function periodRange(period, ref = new Date()) {
  const d = new Date(ref);
  let from, to = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
  if (period === 'week') {
    const day = (d.getDay() + 6) % 7; // måndag = 0
    from = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
  } else if (period === 'month') {
    from = new Date(d.getFullYear(), d.getMonth(), 1);
  } else if (period === 'year') {
    from = new Date(d.getFullYear(), 0, 1);
  } else {
    from = new Date(0);
  }
  return { from: from.getTime(), to: to.getTime() };
}

route(/^\/stats$/, async (_m, u) => {

  const period = params.get('period') || 'month';
  const customFrom = params.get('from');
  const customTo = params.get('to');
  let range;
  if (customFrom && customTo) {
    range = { from: new Date(customFrom).getTime(), to: new Date(customTo).getTime() + 86400000 - 1 };
  } else {
    range = periodRange(period);
  }
  const inRange = (ts) => ts && ts >= range.from && ts <= range.to;

  const myPublished = await db.byIndex('bookings', 'buyerId', u.id);
  const myAccepted = await db.byIndex('bookings', 'haulerId', u.id);

  const publishedInRange = myPublished.filter(b => inRange(b.createdAt));
  const acceptedInRange  = myAccepted.filter(b => inRange(b.acceptedAt));
  const completedInRange = myAccepted.filter(b => b.status === 'completed' && inRange(b.completedAt));

  const omsattning   = completedInRange.reduce((s, b) => s + (b.price || 0), 0);
  const provBetald   = completedInRange.reduce((s, b) => s + (b.commission || 0), 0);
  const netto        = omsattning - provBetald;

  const periodOpts = ['week','month','year','all']
    .map(p => `<option value="${p}" ${p===period?'selected':''}>${({week:'Denna vecka',month:'Denna månad',year:'Detta år',all:'Allt'})[p]}</option>`).join('');

  mount(`

    <div class="card">
      <form id="statsForm" class="btn-row" style="align-items:center">
        <label class="muted">Period:</label>

route(/^\/admin\/pricing$/, async (_m, u) => {
  if (!u || u.role !== 'admin') return navigate('/');
  const renderEditor = () => {
    mount(`
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <a href="#/settlement" class="btn secondary">← Tillbaka</a>
        <h2 style="margin:0">💰 Redigera prislista</h2>
      </div>
      <div class="banner info">Här bestämmer du månadsavgiften per antal bilar. Ändringar gäller direkt för alla åkare (utom de med manuell månadsavgift satt på sitt konto). Moms (${(VAT_RATE*100).toFixed(0)}%) läggs på vid fakturering.</div>
      <div class="card">
        <table id="tiersTable">
          <thead><tr><th>Min antal bilar</th><th>Max antal bilar</th><th>Pris/månad (kr exkl moms)</th><th>Inkl moms</th><th></th></tr></thead>
          <tbody>
            ${PRICING_TIERS.map((t, i) => `<tr data-i="${i}">
              <td><input type="number" min="1" step="1" name="min" value="${esc(t.min)}" class="pricing-min"></td>
              <td><input type="number" min="1" step="1" name="max" value="${esc(t.max)}" class="pricing-max"></td>
              <td><input type="number" min="0" step="1" name="price" value="${esc(t.price)}" class="pricing-price"> kr</td>
              <td class="muted">${fmtMoney(t.price * (1 + VAT_RATE))}</td>
              <td><button class="danger icon-btn" data-deltier="${i}" title="Ta bort">🗑</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div class="btn-row" style="margin-top:12px">
          <button id="addTierBtn" class="secondary">➕ Lägg till prisnivå</button>
          <button id="saveTiersBtn" class="ok">💾 Spara prislista</button>
          <button id="resetTiersBtn" class="danger">↺ Återställ till standard</button>
        </div>
        <p class="muted" style="margin-top:12px;font-size:12px">Standardvärden: ${DEFAULT_PRICING_TIERS.map(t => `${t.min}–${t.max} bilar: ${fmtMoney(t.price)}/mån`).join(' · ')}</p>
      </div>
    `);

    document.getElementById('addTierBtn').onclick = () => {
      const lastMax = PRICING_TIERS.length > 0 ? PRICING_TIERS[PRICING_TIERS.length - 1].max : 0;
      PRICING_TIERS = [...PRICING_TIERS, { min: lastMax + 1, max: lastMax + 5, price: 0 }];
      renderEditor();
    };

    document.querySelectorAll('button[data-deltier]').forEach(btn => {
      btn.onclick = () => {
        const i = Number(btn.dataset.deltier); // index i pricing-arrayen, fortfarande nummer
        PRICING_TIERS = PRICING_TIERS.filter((_, j) => j !== i);
        if (PRICING_TIERS.length === 0) PRICING_TIERS = [{ min: 1, max: 5, price: 0 }];
        renderEditor();
      };
    });

    document.getElementById('saveTiersBtn').onclick = () => {
      try {
        const rows = document.querySelectorAll('#tiersTable tbody tr');
        const newTiers = [...rows].map(tr => ({
          min: Number(tr.querySelector('input[name="min"]').value),
          max: Number(tr.querySelector('input[name="max"]').value),
          price: Number(tr.querySelector('input[name="price"]').value),
        }));
        // Validering
        for (let i = 0; i < newTiers.length; i++) {
          const t = newTiers[i];
          if (isNaN(t.min) || isNaN(t.max) || isNaN(t.price)) throw new Error(`Rad ${i+1}: alla fält måste vara nummer`);
          if (t.min < 1 || t.max < t.min) throw new Error(`Rad ${i+1}: min måste vara ≥ 1 och max ≥ min`);
          if (t.price < 0) throw new Error(`Rad ${i+1}: pris kan inte vara negativt`);
        }
        // Kolla att intervallen inte överlappar
        const sorted = [...newTiers].sort((a, b) => a.min - b.min);
        for (let i = 1; i < sorted.length; i++) {
          if (sorted[i].min <= sorted[i-1].max) throw new Error(`Intervallerna överlappar mellan ${sorted[i-1].min}-${sorted[i-1].max} och ${sorted[i].min}-${sorted[i].max}`);
        }
        savePricingTiers(newTiers);
        toast('Prislistan sparad');
        renderEditor();
      } catch (err) {
        toast('Fel: ' + err.message, 'err');
      }
    };

    document.getElementById('resetTiersBtn').onclick = () => {
      if (!confirm('Återställ prislistan till standardvärden?\n\n' + DEFAULT_PRICING_TIERS.map(t => `${t.min}–${t.max} bilar: ${t.price} kr/mån`).join('\n'))) return;
      resetPricingTiers();
      toast('Prislistan återställd');
      renderEditor();
    };
  };
  renderEditor();
});

      <p class="muted" style="margin-top:12px;font-size:12px">Tariffen justeras automatiskt när du lägger till eller tar bort bilar. Provperioden om 14 dagar är kostnadsfri och kräver inget kort.</p>

});

route(/^\/notifications$/, async (_m, u) => {
  if (!u) return navigate('/login');
  const all = await db.byIndex('notifications', 'userId', u.id);
  all.sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
  // markera alla som lästa när vyn öppnas
  for (const n of all) { if (!n.read) { n.read = 1; await db.put('notifications', n); } }
  _unreadCache = 0;
  mount(`
    <h2>Aviseringar (${all.length})</h2>
    <div class="card">

          <tbody>
          ${all.map(n => `<tr>
            <td class="muted" style="font-size:12px;white-space:nowrap">${fmtDate(n.createdAt)}</td>
            <td>${esc(n.message)}</td>
            <td>${n.bookingId ? `<a class="btn secondary" href="#/booking/${n.bookingId}">Öppna</a>` : ''}</td>

// --------- Bokningsdetalj (köpare / åkare / admin) ---------
route(/^\/booking\/([\w-]+)$/, async (m, u) => {
  const id = m[1];
  const b = await db.get('bookings', id);
  if (!b) { toast('Bokningen finns inte', 'err'); return navigate('/'); }

  let buyer = await db.get('users', b.buyerId);
  if (!buyer) {
    // Bokningen har en föråldrad uppdragsgivare (t.ex. från tidigare seed). Använd en placeholder.
    buyer = { id: b.buyerId, name: '(borttagen användare)', email: '', phone: '', company: '' };
  }
  let hauler = b.haulerId ? await db.get('users', b.haulerId) : null;
  if (b.haulerId && !hauler) {
    hauler = { id: b.haulerId, name: '(borttagen åkare)', email: '', phone: '', company: '' };
  }

  // Access-regler
  const isBuyer = u && u.id === b.buyerId;
  const isAssignedHauler = u && hauler && u.id === hauler.id;
  const isOtherHauler = u && canAcceptAndPost(u) && !isBuyer && !isAssignedHauler;
  const isAdmin = u && u.role === 'admin';
  let isDriver = false;
  let driverRow = null;
  if (u && u.role === 'chauffor') {
    driverRow = await db.oneByIndex('drivers', 'email', u.email);
    isDriver = !!(driverRow && b.driverId === driverRow.id);
    if (!isDriver) { toast('Du är inte tilldelad denna körning', 'err'); return navigate('/'); }
  }

  if (!u) {
    if (b.status !== 'open') { toast('Logga in för att se denna körning', 'err'); return navigate('/login'); }
    return renderBookingDetail(b, buyer, null, null, { isBuyer:false, isAssignedHauler:false, isOtherHauler:false, isAdmin:false, isDriver:false, isPublic:true });
  }

  if (!isBuyer && !isAdmin && !isDriver && !canAcceptAndPost(u)) {
    toast('Ingen åtkomst', 'err'); return navigate('/');
  }
  // Övriga inloggade kan se öppna och sina egna; inte andras accepterade
  // Chaufför som är tilldelad får också se accepterade bokningar
  if (!isBuyer && !isAdmin && !isDriver && b.status !== 'open' && !isAssignedHauler) {
    toast('Bokningen är inte längre tillgänglig', 'err'); return navigate('/');
  }

  try {
    await renderBookingDetail(b, buyer, hauler, u, { isBuyer, isAssignedHauler, isOtherHauler, isAdmin, isDriver, driverRow });
  } catch (err) {
    console.error('Booking detail-fel:', err);
    document.getElementById('app').innerHTML = layout(`<div class="banner err">Kunde inte visa bokningen: ${esc(err.message || String(err))}</div><a class="btn" href="#/">← Tillbaka</a>`);
  }
});

async function renderBookingDetail(b, buyer, hauler, me, ctx) {
  const { isBuyer, isAssignedHauler, isOtherHauler, isAdmin, isDriver } = ctx;
  const canSeeContacts = (b.status !== 'open') && (isBuyer || isAssignedHauler || isAdmin || isDriver);
  const hideMoney = !!isDriver;
  const assignedVehicle = b.vehicleId ? await db.get('vehicles', b.vehicleId) : null;
  const assignedDriver = b.driverId ? await db.get('drivers', b.driverId) : null;
  const bids = (b.status === 'open') ? await bidsForBooking(b.id) : [];
  const myBid = me ? bids.find(x => x.haulerId === me.id && x.status === 'pending') : null;
  const haulersById = {};
  for (const x of bids) {
    if (!haulersById[x.haulerId]) haulersById[x.haulerId] = await db.get('users', x.haulerId);
  }

  // kontaktuppgifter — visas bara när accept + toggle på
  const buyerContact = canSeeContacts
    ? `<dt>E-post</dt><dd>${esc(buyer.email)}</dd><dt>Telefon</dt><dd>${esc(buyer.phone)}</dd>`
    : `<dt>Kontakt</dt><dd class="muted">Visas efter accept</dd>`;

  const haulerContact = !hauler ? '' : (canSeeContacts
    ? `<dt>E-post</dt><dd>${esc(hauler.email)}</dd><dt>Telefon</dt><dd>${esc(hauler.phone)}</dd>`
    : `<dt>Kontakt</dt><dd class="muted">Visas efter accept</dd>`);

  const bookingImgUrl = blobToUrl(b.bookingImageUrl || b.bookingImage);
  const proofImgUrl = blobToUrl(b.proofImageUrl || b.proofImage);

  let actions = '';
  if (isOtherHauler && b.status === 'open') {
    if (myBid) {
      const last = latestBidAmount(myBid);
      const lastBy = latestBidBy(myBid);
      if (lastBy === 'buyer') {
        actions = `
          <div class="banner info"><b>Motbud från uppdragsgivaren:</b> ${fmtMoney(last)}</div>
          <button id="acceptCounterBtn" class="ok" data-bid="${myBid.id}">✓ Acceptera ${fmtMoney(last)}</button>
          <div class="field bid-field" style="margin-top:8px"><label>Eller lägg ett nytt motbud (kr)</label>
            <input type="number" id="newCounter" min="1" step="1"></div>
          <button id="counterBackBtn" class="secondary" data-bid="${myBid.id}">↩ Skicka motbud</button>
          <button id="withdrawBidBtn" class="danger" data-bid="${myBid.id}">Dra tillbaka bud</button>`;
      } else {
        actions = `
          <div class="banner info">Du har lagt ett bud på <b>${fmtMoney(last)}</b>. Väntar på svar från uppdragsgivaren.</div>
          <button id="withdrawBidBtn" class="danger" data-bid="${myBid.id}">Dra tillbaka bud</button>`;
      }
    } else if (b.price != null) {
      actions = `
        <div class="banner info">Uppdragsgivaren föreslår <b>${fmtMoney(b.price)}</b>. Du kan acceptera eller lägga ett motbud.</div>
        <button id="acceptBtn" class="ok">✓ Acceptera ${fmtMoney(b.price)}</button>
        <div class="field bid-field" style="margin-top:10px"><label>Eller lägg ett motbud (kr, exkl. moms)</label>
          <input type="number" id="bidAmount" min="1" step="1" placeholder="t.ex. ${Math.round(b.price * 1.1)}"></div>
        <button id="placeBidBtn" class="secondary">💰 Lägg motbud</button>`;
    } else {
      actions = `
        <div class="field bid-field"><label>Lägg ett bud (kr, exkl. moms)</label>
          <input type="number" id="bidAmount" min="1" step="1" placeholder="t.ex. 8500" required></div>
        <button id="placeBidBtn" class="ok">💰 Lägg bud</button>`;
    }
  }
  // Lastad/Lossad/Utförd-flöde för chaufför ELLER tilldelad åkare
  if ((isAssignedHauler || isDriver) && b.status === 'accepted') {
    const loaded = !!b.loadedAt;
    const unloaded = !!b.unloadedAt;
    let stepHtml = '';
    if (!loaded) {
      stepHtml = `
        <div class="banner info" style="margin-bottom:12px">
          📦 <b>Steg 1 av 3:</b> Lastning hos avsändaren
        </div>
        <button id="markLoadedBtn" class="ok" style="font-size:16px;padding:14px 24px">📍 Markera som LASTAD</button>
        <p class="muted" style="font-size:12px;margin-top:8px">Tryck när lasten är ombord. Både uppdragsgivaren och åkeriet aviseras.</p>`;
    } else if (!unloaded) {
      stepHtml = `
        <div class="banner ok" style="margin-bottom:8px">✅ Lastat ${fmtDate(b.loadedAt)}</div>
        <div class="banner info" style="margin-bottom:12px">
          🏁 <b>Steg 2 av 3:</b> Leverans till mottagaren
        </div>
        <button id="markUnloadedBtn" class="ok" style="font-size:16px;padding:14px 24px">🏁 Markera som LOSSAD</button>
        <button id="undoLoadedBtn" class="secondary" style="margin-top:8px">↩ Ångra lastning</button>
        <p class="muted" style="font-size:12px;margin-top:8px">Tryck Lossad när godset är levererat. Klick fel? Använd Ångra-knappen.</p>`;
    } else {
      stepHtml = `
        <div class="banner ok" style="margin-bottom:8px">✅ Lastat ${fmtDate(b.loadedAt)} · Lossat ${fmtDate(b.unloadedAt)}</div>
        <div class="banner info" style="margin-bottom:12px">
          📄 <b>Steg 3 av 3:</b> Ladda upp fraktsedel & slutför
        </div>
        <div class="field" style="margin-top:12px">
          <label>Bild på fraktsedel (kvitto från mottagaren)</label>

        <button id="undoUnloadedBtn" class="secondary" style="margin-top:8px">↩ Ångra lossning</button>`;
    }
    actions = stepHtml;
  }
  if (isBuyer && b.status === 'open') {
    actions += ` <button id="cancelBtn" class="danger">Ta bort körning</button>`;
  } else if (isAdmin && !isBuyer && b.status !== 'completed') {
    // Admin kan radera vilken bokning som helst (utom redan utförda)
    actions += ` <button id="cancelBtn" class="danger">🗑 Ta bort (admin)</button>`;
  }

  let bidsBlock = '';
  if (isBuyer && b.status === 'open') {
    if (bids.length === 0) {
      bidsBlock = b.price == null
        ? `<div class="card"><h3>Bud (0)</h3><div class="empty">Inga bud ännu. Vänta på att åkare lägger bud.</div></div>`
        : '';
    } else {
      bidsBlock = `<div class="card"><h3>Inkomna bud (${bids.length})</h3>
        ${b.price != null ? `<div class="muted" style="margin-bottom:8px">Ditt föreslagna pris: <b>${fmtMoney(b.price)}</b></div>` : ''}
        <table>
          <thead><tr><th>Åkare</th><th>Senaste bud</th><th>Status</th><th>Historik</th><th></th></tr></thead>
          <tbody>
          ${bids.map(bd => {
            const h = haulersById[bd.haulerId];
            const last = latestBidAmount(bd);
            const lastBy = latestBidBy(bd);
            const history = bd.rounds.map(r => `${r.by==='hauler'?'Åkare':'Du'}: ${fmtMoney(r.amount)}`).join(' → ');
            const statusLabel = bd.status === 'pending'
              ? (lastBy === 'hauler' ? 'Väntar på ditt svar' : 'Motbud skickat — väntar på åkare')
              : bd.status;
            const canAct = bd.status === 'pending' && lastBy === 'hauler';
            return `<tr>
              <td><b>${esc(h?.name || '?')}</b>${h?.company ? ' · ' + esc(h.company) : ''}</td>
              <td><b>${fmtMoney(last)}</b></td>
              <td>${esc(statusLabel)}</td>
              <td class="muted" style="font-size:12px">${esc(history)}</td>

          }).join('')}
          </tbody>
        </table></div>`;
    }
  }

  const haulerLabel = hauler ? esc(hauler.name) + (hauler.company ? ' (' + esc(hauler.company) + ')' : '') : 'okänd åkare';
  const statusBanner =
    b.status === 'open' ? `<div class="banner info">Körningen är <b>öppen</b>. Väntar på att en åkare ska acceptera.</div>`
    : b.status === 'accepted' ? `<div class="banner ok">Körningen är <b>accepterad</b> av ${haulerLabel}.</div>`
    : `<div class="banner warn">Körningen är <b>utförd</b> ${b.completedAt ? '(' + fmtDate(b.completedAt) + ')' : ''}.</div>`;

  // Admin-only: visa kontaktuppgifter för importerade bokningar
  let adminImportBlock = '';

    let invitation = null;
    let emailImport = null;

            ${b.externalOrderId ? `<dt>Externt order-ID</dt><dd><code style="background:#fef3c7;padding:2px 6px;border-radius:3px">${esc(b.externalOrderId)}</code></dd>` : ''}

          <dt>Lossning</dt><dd>${esc(b.unloadDate)} ${esc(b.unloadTime || '')}</dd>
          ${b.weight ? `<dt>Vikt</dt><dd>${esc(b.weight)} kg</dd>` : ''}
          ${b.flm ? `<dt>Flakmeter (FLM)</dt><dd>${esc(b.flm)}</dd>` : ''}
          ${b.pallets ? `<dt>Antal pall</dt><dd>${esc(b.pallets)} st</dd>` : ''}
          <dt>Krav</dt><dd>

          ${b.unloadedAt ? `<dt>🏁 Lossad</dt><dd><b style="color:#147a3d">${fmtDate(b.unloadedAt)}</b></dd>` : ''}

    ${(isDriver || ctx.isPublic) ? '' : `<div class="card" id="chat-card">
      <h3>Intern chatt</h3>

  if (document.getElementById('assignBtn')) {
    document.getElementById('assignBtn').onclick = async () => {

      const drivers = await db.byIndex('drivers', 'haulerId', me.id);
      const activeDrivers = drivers.filter(d => d.active !== false);
      if (vehicles.length === 0 || activeDrivers.length === 0) {
